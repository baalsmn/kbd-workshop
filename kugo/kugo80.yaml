units:
  sp: 19
  kc: 18.2
  sw: 14.1



points:
  # horizontal spacing between centerpoints:
  key.spread: sp 
  key.height: kc
  key.width: kc
  # vertical spacing between centerpoints:
  key.padding: sp #
  key.stagger: 0
  key.splay: 0
  # keycap width in U and stabilizer flag, read by the ks33_hotswap footprint
  key.keycap_u: 1
  key.stab: false
  zones:
    hand-zone:
      # Moves the whole keyboard (both halves) on the KiCad sheet.
      # x: right, y: negative = down on the KiCad sheet. Tune after the first run.
      anchor:
        shift: [50, -100]
      rotate: -15
      columns:
        c1:
          key.column_net: C1   # shared by the left and the mirrored key
          rows.r5.skip: true
          rows.r1.led_l_in: LED_DATA
          rows.r1.led_l_out: LED_1
          rows.r1.led_r_in: LED_79
          rows.r1.led_r_out: LED_END
          rows.r2.led_l_in: LED_1
          rows.r2.led_l_out: LED_2
          rows.r2.led_r_in: LED_78
          rows.r2.led_r_out: LED_79
          rows.r3.led_l_in: LED_2
          rows.r3.led_l_out: LED_3
          rows.r3.led_r_in: LED_77
          rows.r3.led_r_out: LED_78
          rows.r4.led_l_in: LED_3
          rows.r4.led_l_out: LED_4
          rows.r4.led_r_in: LED_76
          rows.r4.led_r_out: LED_77
        c2:
          key.column_net: C2   # shared by the left and the mirrored key
          rows.r5.skip: true
          # KLE: r3 Shift / r4 Layer are 1.5U, extended towards c3
          # (the shift on r3 carries over to r4)
          rows.r3.shift: [0.25sp, 0]
          rows.r3.keycap_u: 1.5
          rows.r4.keycap_u: 1.5
          rows.r1.led_l_in: LED_7
          rows.r1.led_l_out: LED_8
          rows.r1.led_r_in: LED_72
          rows.r1.led_r_out: LED_73
          rows.r2.led_l_in: LED_6
          rows.r2.led_l_out: LED_7
          rows.r2.led_r_in: LED_73
          rows.r2.led_r_out: LED_74
          rows.r3.led_l_in: LED_5
          rows.r3.led_l_out: LED_6
          rows.r3.led_r_in: LED_74
          rows.r3.led_r_out: LED_75
          rows.r4.led_l_in: LED_4
          rows.r4.led_l_out: LED_5
          rows.r4.led_r_in: LED_75
          rows.r4.led_r_out: LED_76
        c3:
          key.column_net: C3   # shared by the left and the mirrored key
          key.spread: 1.25sp
          # KLE (relative to c1): r1 1U at 2.0, r2 1.5U at 2.25, r3/r4 1U at 2.5,
          # r5 (Esc) 1.25U at 2.375 [U]; shifts carry over to the rows above
          rows.r1.shift: [-0.25sp,0]
          rows.r2.shift: [0.25sp,0]
          rows.r3.shift: [0.25sp,0]
          rows.r5.shift: [-0.125sp,0]
          rows.r2.keycap_u: 1.5
          rows.r5.keycap_u: 1.25
          rows.r1.led_l_in: LED_8
          rows.r1.led_l_out: LED_9
          rows.r1.led_r_in: LED_71
          rows.r1.led_r_out: LED_72
          rows.r2.led_l_in: LED_9
          rows.r2.led_l_out: LED_10
          rows.r2.led_r_in: LED_70
          rows.r2.led_r_out: LED_71
          rows.r3.led_l_in: LED_10
          rows.r3.led_l_out: LED_11
          rows.r3.led_r_in: LED_69
          rows.r3.led_r_out: LED_70
          rows.r4.led_l_in: LED_11
          rows.r4.led_l_out: LED_12
          rows.r4.led_r_in: LED_68
          rows.r4.led_r_out: LED_69
          rows.r5.led_l_in: LED_12
          rows.r5.led_l_out: LED_13
          rows.r5.led_r_in: LED_67
          rows.r5.led_r_out: LED_68
        c4:
          key.column_net: C4   # shared by the left and the mirrored key
          # KLE: column 1.25U from c3 (moves c4..c9 0.25U towards the centre),
          # r1 (Ctrl) 1.5U extended towards c3; r2 shifts back
          key.spread: 1.25sp
          rows.r1.shift: [-0.25sp, 0]
          rows.r1.keycap_u: 1.5
          rows.r2.shift: [0.25sp, 0]
          rows.r1.led_l_in: LED_17
          rows.r1.led_l_out: LED_18
          rows.r1.led_r_in: LED_62
          rows.r1.led_r_out: LED_63
          rows.r2.led_l_in: LED_16
          rows.r2.led_l_out: LED_17
          rows.r2.led_r_in: LED_63
          rows.r2.led_r_out: LED_64
          rows.r3.led_l_in: LED_15
          rows.r3.led_l_out: LED_16
          rows.r3.led_r_in: LED_64
          rows.r3.led_r_out: LED_65
          rows.r4.led_l_in: LED_14
          rows.r4.led_l_out: LED_15
          rows.r4.led_r_in: LED_65
          rows.r4.led_r_out: LED_66
          rows.r5.led_l_in: LED_13
          rows.r5.led_l_out: LED_14
          rows.r5.led_r_in: LED_66
          rows.r5.led_r_out: LED_67
        c5:
          rows.r1.keycap_u: 2   # 2U bottom-row key with KS-57 stabilizer
          rows.r1.stab: true
          key.column_net: C5   # shared by the left and the mirrored key
          key.stagger: 0.25sp
          rows.r1.shift: [0.5sp,0]
          rows.r2.shift: [-0.5sp,0]
          rows.r1.led_l_in: LED_18
          rows.r1.led_l_out: LED_19
          rows.r1.led_r_in: LED_61
          rows.r1.led_r_out: LED_62
          rows.r2.led_l_in: LED_19
          rows.r2.led_l_out: LED_20
          rows.r2.led_r_in: LED_60
          rows.r2.led_r_out: LED_61
          rows.r3.led_l_in: LED_20
          rows.r3.led_l_out: LED_21
          rows.r3.led_r_in: LED_59
          rows.r3.led_r_out: LED_60
          rows.r4.led_l_in: LED_21
          rows.r4.led_l_out: LED_22
          rows.r4.led_r_in: LED_58
          rows.r4.led_r_out: LED_59
          rows.r5.led_l_in: LED_22
          rows.r5.led_l_out: LED_23
          rows.r5.led_r_in: LED_57
          rows.r5.led_r_out: LED_58
        c6:
          key.column_net: C6   # shared by the left and the mirrored key
          rows.r1.skip: true
          rows.r2.shift: [0,0]
          rows.r2.led_l_in: LED_26
          rows.r2.led_l_out: LED_27
          rows.r2.led_r_in: LED_53
          rows.r2.led_r_out: LED_54
          rows.r3.led_l_in: LED_25
          rows.r3.led_l_out: LED_26
          rows.r3.led_r_in: LED_54
          rows.r3.led_r_out: LED_55
          rows.r4.led_l_in: LED_24
          rows.r4.led_l_out: LED_25
          rows.r4.led_r_in: LED_55
          rows.r4.led_r_out: LED_56
          rows.r5.led_l_in: LED_23
          rows.r5.led_l_out: LED_24
          rows.r5.led_r_in: LED_56
          rows.r5.led_r_out: LED_57
        c7:
          rows.r1.keycap_u: 2   # 2U bottom-row key with KS-57 stabilizer
          rows.r1.stab: true
          key.column_net: C7   # shared by the left and the mirrored key
          key.stagger: -.25sp
          rows.r1.shift: [0.5sp,0]
          rows.r2.shift: [-0.5sp,0]
          rows.r1.led_l_in: LED_27
          rows.r1.led_l_out: LED_28
          rows.r1.led_r_in: LED_52
          rows.r1.led_r_out: LED_53
          rows.r2.led_l_in: LED_28
          rows.r2.led_l_out: LED_29
          rows.r2.led_r_in: LED_51
          rows.r2.led_r_out: LED_52
          rows.r3.led_l_in: LED_29
          rows.r3.led_l_out: LED_30
          rows.r3.led_r_in: LED_50
          rows.r3.led_r_out: LED_51
          rows.r4.led_l_in: LED_30
          rows.r4.led_l_out: LED_31
          rows.r4.led_r_in: LED_49
          rows.r4.led_r_out: LED_50
          rows.r5.led_l_in: LED_31
          rows.r5.led_l_out: LED_32
          rows.r5.led_r_in: LED_48
          rows.r5.led_r_out: LED_49
        c8:
          key.column_net: C8   # shared by the left and the mirrored key
          rows.r1.skip: true
          rows.r2.led_l_in: LED_35
          rows.r2.led_l_out: LED_36
          rows.r2.led_r_in: LED_44
          rows.r2.led_r_out: LED_45
          rows.r3.led_l_in: LED_34
          rows.r3.led_l_out: LED_35
          rows.r3.led_r_in: LED_45
          rows.r3.led_r_out: LED_46
          rows.r4.led_l_in: LED_33
          rows.r4.led_l_out: LED_34
          rows.r4.led_r_in: LED_46
          rows.r4.led_r_out: LED_47
          rows.r5.led_l_in: LED_32
          rows.r5.led_l_out: LED_33
          rows.r5.led_r_in: LED_47
          rows.r5.led_r_out: LED_48
        c9:
          key.column_net: C9   # shared by the left and the mirrored key
          key.stagger: -0.25sp   # KLE
          rows.r5.skip: true
          # KLE: r1 (Layer) 1.25U, extended towards the centre; r2 shifts back
          rows.r1.shift: [0.125sp, 0]
          rows.r1.keycap_u: 1.25
          rows.r2.shift: [-0.125sp, 0]
          rows.r1.led_l_in: LED_36
          rows.r1.led_l_out: LED_37
          rows.r1.led_r_in: LED_43
          rows.r1.led_r_out: LED_44
          rows.r2.led_l_in: LED_37
          rows.r2.led_l_out: LED_38
          rows.r2.led_r_in: LED_42
          rows.r2.led_r_out: LED_43
          rows.r3.led_l_in: LED_38
          rows.r3.led_l_out: LED_39
          rows.r3.led_r_in: LED_41
          rows.r3.led_r_out: LED_42
          rows.r4.led_l_in: LED_39
          rows.r4.led_l_out: LED_40
          rows.r4.led_r_in: LED_40
          rows.r4.led_r_out: LED_41
      rows:
        r1:
          row_net: R1        # left half
          row_net_r: R6      # right half
        r2:
          row_net: R2        # left half
          row_net_r: R7      # right half
        r3:
          row_net: R3        # left half
          row_net_r: R8      # right half
        r4:
          row_net: R4        # left half
          row_net_r: R9      # right half
        r5:
          row_net: R5        # left half
          row_net_r: R10      # right half

  mirror: &mirror
    ref: hand-zone_c9_r3
    shift: [.5sp, .5sp]
    distance: sp+40

outlines:


  switches_outline:
    - what: rectangle
      where: true
      size: [sw,sw]
  # Gateron KS-57 low-profile plate-mounted 2U stabilizer, plate cutout as
  # recommended in the KS-57B210T spec (stabs 24 mm apart, 6.0 x 12.5 each,
  # 1.7 mm lever notch, 2.5 mm channels into the switch cutout).
  # Notch side = south (towards the user), as drawn in the spec.
  stab_cutouts:
    - what: rectangle
      where: /_c[57]_r1$/
      size: [6, 12.5]
      adjust.shift: [-12, -0.6]
    - what: rectangle
      where: /_c[57]_r1$/
      size: [6, 12.5]
      adjust.shift: [12, -0.6]
    - what: rectangle
      where: /_c[57]_r1$/
      size: [1.7, 1.4]
      adjust.shift: [-12, -7.35]
    - what: rectangle
      where: /_c[57]_r1$/
      size: [1.7, 1.4]
      adjust.shift: [12, -7.35]
    - what: rectangle
      where: /_c[57]_r1$/
      size: [2.2, 2.5]
      adjust.shift: [-8.0, -1.4]
    - what: rectangle
      where: /_c[57]_r1$/
      size: [2.2, 2.5]
      adjust.shift: [8.0, -1.4]
  # Cirque TM040040 trackpad (40 mm): centre 2 mm below the c9_r2 midpoint
  cirque_out:
    - what: circle
      radius: 22.1
      where: 
        aggregate.parts: 
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [0,-2]
  # slot for the 12-pin 0.5 mm FFC: straight down from the trackpad's
  # vertical connector, then a 90 deg bend into the Molex on the back
  cirque_connector:
    - what: rectangle
      size: [8.5, 2]
      corner: 0.5
      where:
        aggregate.parts: 
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        shift: [0, -17.4]
  # Reset button (TS-1187A on the PCB front) in the empty c9_r5 spot, centre
  # 5 mm from the C8R5 keycap right edge and the C9R4 keycap top edge.
  # The 1.5 mm tall button does not fit the 1.3 mm PCB-plate gap, so the
  # plate gets a cutout; it is pressed with a pin through a hole in the
  # centre cover (button top 1 mm below the cover).
  reset_cutout:
    - what: rectangle
      size: [6.5, 6.5]
      corner: 0.5
      where: /^hand-zone_c8_r5$/
      adjust:
        shift: [0.5kc + 5, -(sp - 0.5kc) - 0.25sp + 5]
  reset_hole:
    - what: circle
      radius: 1
      where: /^hand-zone_c8_r5$/
      adjust:
        shift: [0.5kc + 5, -(sp - 0.5kc) - 0.25sp + 5]
  # 0.96" SSD1306 module, rotated 180 deg (header at the bottom, y 33.3,
  # just below the Helios), soldered on bare header pins ~1.2 mm above the
  # PCB (no plastic spacer), so it sits inside this plate cutout.
  # Window = display area (in the centre cover).
  oled:
    - what: rectangle
      size: [28.2, 28]
      corner: 1
      where:
        aggregate.parts: 
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        shift: [0, 45.5]
  # visible screen: the 21.7 x 10.9 active area + ~0.6 mm margin
  oled_window:
    - what: rectangle
      size: [23, 12]
      corner: 1
      where:
        aggregate.parts: 
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        shift: [0, 46.15]
  # 2 indicator LEDs halfway between the Helios and the C8R5 keycap, level
  # with the c9 screw holes (3 mm light holes in the plate and both
  # centre-cover layers): left = layout layer colour, right = function/layer
  # lock (green).
  indicator_holes:
    - what: circle
      radius: 1.5
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [-25.3, 61.07]
    - what: circle
      radius: 1.5
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [25.3, 61.07]
  # trackpad opening in the centre cover: 40 mm pad + 0.3 mm clearance
  cirque_flush:
    - what: circle
      radius: 20.3
      where:
        aggregate.parts: 
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [0,-2]
  # 4 riser columns from the base plate through the PCB, supporting the
  # trackpad in its 2 mm component-free edge ring (r = 19 mm, diagonals)
  trackpad_risers:
    - what: circle
      radius: 1.6
      where:
        aggregate.parts: 
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [13.44, 11.44]
    - what: circle
      radius: 1.6
      where:
        aggregate.parts: 
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [-13.44, 11.44]
    - what: circle
      radius: 1.6
      where:
        aggregate.parts: 
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [-13.44, -15.44]
    - what: circle
      radius: 1.6
      where:
        aggregate.parts: 
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [13.44, -15.44]
  cirque_cover:
    - what: polygon
      operation: stack
      fillet: 2
      # inner edge follows c9 (keycap edge + ~1.4 mm), with a step around the
      # 1.25U c9_r1 (centred 0.125sp towards the middle, half width 0.625sp);
      # the step sits 0.8 mm above the row boundary to keep ~1 mm off the r1 cap
      points:
      - ref: hand-zone_c9_r1
        shift: [(0.625sp+1), -0.5sp-1]
      - ref: hand-zone_c9_r1
        shift: [(0.625sp+1), 0.5sp+0.8]
      - ref: hand-zone_c9_r2
        shift: [(0.5sp+1), -0.5sp+0.8]
      - ref: hand-zone_c9_r4
        shift: [(0.5sp+1), 0.5sp+1]
      - ref: hand-zone_c9_r4
        shift: [-0.5sp+1,0.5sp+1]
      - ref: hand-zone_c8_r5
        shift: [0.5sp+1,0.5sp]
      - ref: mirror_hand-zone_c8_r5
        shift: [0.5sp+1,0.5sp]
      - ref: mirror_hand-zone_c9_r4
        shift: [-0.5sp+1,.5sp+1]
      - ref: mirror_hand-zone_c9_r4
        shift: [(0.5sp + 1), 0.5sp+1]
      - ref: mirror_hand-zone_c9_r2
        shift: [(0.5sp + 1), -0.5sp+0.8]
      - ref: mirror_hand-zone_c9_r1
        shift: [(0.625sp + 1), 0.5sp+0.8]
      - ref: mirror_hand-zone_c9_r1
        shift: [(0.625sp + 1), -0.5sp-1]
  # Screwless support studs, printed with the case base: a 5 mm post from the
  # floor up to the PCB, continuing as a 2.5 mm pin through the PCB up to the
  # switch plate. Key corners picked for the largest unsupported plate areas,
  # with no pads/parts within 2.8 mm on the back (5 mm base footprint).
  stud_holes:   # PCB holes, 2.9 mm for the 2.5 mm printed pin
    - what: circle
      radius: 1.45
      where:   # 1: c7/c8 at r3/r4 (left)
        ref: hand-zone_c7_r3
        shift: [0.5sp, 0.5sp]
    - what: circle
      radius: 1.45
      where:   # 1: c7/c8 at r3/r4 (right)
        ref: mirror_hand-zone_c7_r3
        shift: [0.5sp, 0.5sp]
    - what: circle
      radius: 1.45
      where:   # 2: c3/c4 at r2/r3 (left)
        ref: hand-zone_c3_r3
        shift: [0.5sp, -0.5sp]
    - what: circle
      radius: 1.45
      where:   # 2: c3/c4 at r2/r3 (right)
        ref: mirror_hand-zone_c3_r3
        shift: [0.5sp, -0.5sp]
    - what: circle
      radius: 1.45
      where:   # 3: c6/c7 at r1/r2 (left)
        ref: hand-zone_c7_r1
        shift: [-0.5sp, 0.5sp]
    - what: circle
      radius: 1.45
      where:   # 3: c6/c7 at r1/r2 (right)
        ref: mirror_hand-zone_c7_r1
        shift: [-0.5sp, 0.5sp]
    - what: circle
      radius: 1.45
      where:   # 4: c1/c2 at r2/r3 (left)
        ref: hand-zone_c1_r2
        shift: [0.5sp, 0.5sp]
    - what: circle
      radius: 1.45
      where:   # 4: c1/c2 at r2/r3 (right)
        ref: mirror_hand-zone_c1_r2
        shift: [0.5sp, 0.5sp]
    - what: circle
      radius: 1.45
      where:   # 5: c3/c4 at r4/r5 (left)
        ref: hand-zone_c3_r4
        shift: [0.5sp, 0.5sp]
    - what: circle
      radius: 1.45
      where:   # 5: c3/c4 at r4/r5 (right)
        ref: mirror_hand-zone_c3_r4
        shift: [0.5sp, 0.5sp]
  stud_base:    # 5 mm post under the PCB (case)
    - what: circle
      radius: 2.5
      where:   # 1: c7/c8 at r3/r4 (left)
        ref: hand-zone_c7_r3
        shift: [0.5sp, 0.5sp]
    - what: circle
      radius: 2.5
      where:   # 1: c7/c8 at r3/r4 (right)
        ref: mirror_hand-zone_c7_r3
        shift: [0.5sp, 0.5sp]
    - what: circle
      radius: 2.5
      where:   # 2: c3/c4 at r2/r3 (left)
        ref: hand-zone_c3_r3
        shift: [0.5sp, -0.5sp]
    - what: circle
      radius: 2.5
      where:   # 2: c3/c4 at r2/r3 (right)
        ref: mirror_hand-zone_c3_r3
        shift: [0.5sp, -0.5sp]
    - what: circle
      radius: 2.5
      where:   # 3: c6/c7 at r1/r2 (left)
        ref: hand-zone_c7_r1
        shift: [-0.5sp, 0.5sp]
    - what: circle
      radius: 2.5
      where:   # 3: c6/c7 at r1/r2 (right)
        ref: mirror_hand-zone_c7_r1
        shift: [-0.5sp, 0.5sp]
    - what: circle
      radius: 2.5
      where:   # 4: c1/c2 at r2/r3 (left)
        ref: hand-zone_c1_r2
        shift: [0.5sp, 0.5sp]
    - what: circle
      radius: 2.5
      where:   # 4: c1/c2 at r2/r3 (right)
        ref: mirror_hand-zone_c1_r2
        shift: [0.5sp, 0.5sp]
    - what: circle
      radius: 2.5
      where:   # 5: c3/c4 at r4/r5 (left)
        ref: hand-zone_c3_r4
        shift: [0.5sp, 0.5sp]
    - what: circle
      radius: 2.5
      where:   # 5: c3/c4 at r4/r5 (right)
        ref: mirror_hand-zone_c3_r4
        shift: [0.5sp, 0.5sp]
  stud_pin:     # 2.5 mm pin through the PCB up to the plate (case)
    - what: circle
      radius: 1.25
      where:   # 1: c7/c8 at r3/r4 (left)
        ref: hand-zone_c7_r3
        shift: [0.5sp, 0.5sp]
    - what: circle
      radius: 1.25
      where:   # 1: c7/c8 at r3/r4 (right)
        ref: mirror_hand-zone_c7_r3
        shift: [0.5sp, 0.5sp]
    - what: circle
      radius: 1.25
      where:   # 2: c3/c4 at r2/r3 (left)
        ref: hand-zone_c3_r3
        shift: [0.5sp, -0.5sp]
    - what: circle
      radius: 1.25
      where:   # 2: c3/c4 at r2/r3 (right)
        ref: mirror_hand-zone_c3_r3
        shift: [0.5sp, -0.5sp]
    - what: circle
      radius: 1.25
      where:   # 3: c6/c7 at r1/r2 (left)
        ref: hand-zone_c7_r1
        shift: [-0.5sp, 0.5sp]
    - what: circle
      radius: 1.25
      where:   # 3: c6/c7 at r1/r2 (right)
        ref: mirror_hand-zone_c7_r1
        shift: [-0.5sp, 0.5sp]
    - what: circle
      radius: 1.25
      where:   # 4: c1/c2 at r2/r3 (left)
        ref: hand-zone_c1_r2
        shift: [0.5sp, 0.5sp]
    - what: circle
      radius: 1.25
      where:   # 4: c1/c2 at r2/r3 (right)
        ref: mirror_hand-zone_c1_r2
        shift: [0.5sp, 0.5sp]
    - what: circle
      radius: 1.25
      where:   # 5: c3/c4 at r4/r5 (left)
        ref: hand-zone_c3_r4
        shift: [0.5sp, 0.5sp]
    - what: circle
      radius: 1.25
      where:   # 5: c3/c4 at r4/r5 (right)
        ref: mirror_hand-zone_c3_r4
        shift: [0.5sp, 0.5sp]
  pcb_mounting: # mounting holes on all elements
    # C2 points
    - what: circle
      radius: 1.2
      where:
        - ref: hand-zone_c2_r1
          shift: [0.6125sp, 0.5sp]   # on the r1/r2 line: the c2/c3 gap above is filled by the 1.25U c3 keys
    - what: circle
      radius: 1.2
      where:
        - ref: mirror_hand-zone_c2_r1
          shift: [0.6125sp, 0.5sp]   # on the r1/r2 line: the c2/c3 gap above is filled by the 1.25U c3 keys
    - what: circle
      radius: 1.2
      where:
        - ref: hand-zone_c2_r3
          shift: [0.6125sp, 0.5sp]
    - what: circle
      radius: 1.2
      where:
        - ref: mirror_hand-zone_c2_r3
          shift: [0.6125sp, 0.5sp]
    
    # C5 points
    - what: circle
      radius: 1.2
      where:
        - ref: hand-zone_c5_r1
          shift: [0, (0.5sp)]
    - what: circle
      radius: 1.2
      where:
        - ref: mirror_hand-zone_c5_r1
          shift: [0, 0.5sp]  
    - what: circle
      radius: 1.2
      where:
        - ref: hand-zone_c5_r4
          shift: [0.5sp, 0.5sp]
    - what: circle
      radius: 1.2
      where:
        - ref: mirror_hand-zone_c5_r4
          shift: [0.5sp, 0.5sp]
    
    # c8 points
    - what: circle
      radius: 1.2
      where:
        - ref: hand-zone_c8_r5
          shift: [(0.5sp+4), 0]
    - what: circle
      radius: 1.2
      where:
        - ref: mirror_hand-zone_c8_r5
          shift: [(0.5sp+4), 0]
    - what: circle
      radius: 1.2
      where:
        - ref: hand-zone_c8_r2
          shift: [(0.5sp), -(0.5sp)-3]   # 3 mm lower: clears c9_r2 socket pad 1
    - what: circle
      radius: 1.2
      where:
        - ref: mirror_hand-zone_c8_r2
          shift: [(0.5sp), -(0.5sp)-3]

      # cirque mounting points    
    - what: circle
      radius: 1.2
      where:
        aggregate.parts: 
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [21,19]     # trackpad centre (0,-2) + (21, 21)
    - what: circle
      radius: 1.2
      where:
        aggregate.parts: 
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [-21,19]
    - what: circle
      radius: 1.2
      where:
        aggregate.parts: 
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [-21,-23]
    - what: circle
      radius: 1.2
      where:
        aggregate.parts: 
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [21,-23]
  edge_mounting: # mounting holes case elements only
    # left bottom
    - what: circle
      radius: 1.2
      where:
        - ref: hand-zone_c1_r1
          shift: [-0.5sp-5.5, -0.75sp-5.5]   # 3.5 mm diagonally off the PCB corner
    - what: circle
      radius: 1.2
      where:
        - ref: mirror_hand-zone_c1_r1
          shift: [-0.5sp-5.5, -0.75sp-5.5]   # 3.5 mm diagonally off the PCB corner 
    # left top corner
    - what: circle
      radius: 1.2
      where:
        - ref: hand-zone_c1_r4
          shift: [-(0.5sp+5), (0.5sp + 5)]
    - what: circle
      radius: 1.2
      where:
        - ref: mirror_hand-zone_c1_r4
          shift: [-(0.5sp+5), (0.5sp + 5)]
    # top left second corner
    - what: circle
      radius: 1.2
      where:
        - ref: hand-zone_c3_r5
          shift: [-(0.5sp+4), (0.5sp + 5)]
    - what: circle
      radius: 1.2
      where:
        - ref: mirror_hand-zone_c3_r5
          shift: [-(0.5sp+4), (0.5sp + 5)]
    #  center hole
    - what: circle
      radius: 1.2
      where:
        - ref: hand-zone_c5_r5
          shift: [0.5sp, (0.5sp + 7)]
    - what: circle
      radius: 1.2
      where:
        - ref: mirror_hand-zone_c5_r5
          shift: [0.5sp, (0.5sp + 7)]
    # bottom center hole
    - what: circle
      radius: 1.2
      where:
        - ref: hand-zone_c5_r1
          shift: [0, -sp-7]   # 5 mm below the PCB edge (c5_r1 sits 0.25sp up)
    - what: circle
      radius: 1.2
      where:
        - ref: mirror_hand-zone_c5_r1
          shift: [0, -sp-7]   # 5 mm below the PCB edge (c5_r1 sits 0.25sp up)
    # top right C9 corner
    - what: circle
      radius: 1.2
      where:
        - ref: hand-zone_c8_r5
          shift: [(0.5sp), (0.5sp + 7)]
    - what: circle
      radius: 1.2
      where:
        - ref: mirror_hand-zone_c8_r5
          shift: [(0.5sp), (0.5sp + 7)]

    #   center two dots
#    - what: circle
#      radius: 1.2
#      where:
#        aggregate.parts: 
#          - hand-zone_c8_r5
#          - mirror_hand-zone_c8_r5
#        shift: [-10, 12.5]
#    - what: circle
#      radius: 1.2
#      where:
#        aggregate.parts: 
#          - hand-zone_c8_r5
#          - mirror_hand-zone_c8_r5
#        shift: [10, 12.5]
    - what: circle
      radius: 1.2
      where:
        - ref: hand-zone_c9_r1
          shift: [(0.5sp+3), -(0.5sp + 7)]   # 5 mm below the PCB edge
    - what: circle
      radius: 1.2
      where:
        - ref: mirror_hand-zone_c9_r1
          shift: [(0.5sp+3), -(0.5sp + 7)]   # 5 mm below the PCB edge
  pcb_outline: # pcb board outline
    - what: polygon
      operation: stack
      expand: 2
      points: 
        # starting at the left bottom corner
        # bottom long edges: 0.5sp below c9_r1 (same as the top edge above
        # c6_r5), parallel to the key rows back to c1_r1 (c9 stagger -0.25sp)
        - ref: hand-zone_c1_r1
          shift: [-0.5sp,-0.75sp]
        - ref: hand-zone_c1_r4
          shift: [-0.5sp, 0.5sp]
        - ref: hand-zone_c2_r4
          shift: [0.5sp, 0.5sp]
        - ref: hand-zone_c3_r5
          shift: [-0.5sp, 0.5sp]
        - ref: hand-zone_c4_r5
          shift: [0.5sp, 0.5sp]
        - ref: hand-zone_c5_r5
          shift: [-0.5sp, 0.5sp]
        - ref: hand-zone_c6_r5
          shift: [0.5sp, 0.5sp]
        - ref: hand-zone_c7_r5
          shift: [-0.5sp, 0.5sp]
        - ref: hand-zone_c8_r5
          shift: [0.5sp, 0.5sp]
        # going over to the mirrored half on top
        - ref: mirror_hand-zone_c8_r5
          shift: [0.5sp, 0.5sp]
        - ref: mirror_hand-zone_c7_r5
          shift: [-0.5sp, 0.5sp]
        - ref: mirror_hand-zone_c6_r5
          shift: [0.5sp, 0.5sp]
        - ref: mirror_hand-zone_c5_r5
          shift: [-0.5sp, 0.5sp]
        - ref: mirror_hand-zone_c4_r5
          shift: [0.5sp, 0.5sp]
        - ref: mirror_hand-zone_c3_r5
          shift: [-0.5sp, 0.5sp]
        - ref: mirror_hand-zone_c2_r4
          shift: [0.5sp, 0.5sp]
        - ref: mirror_hand-zone_c1_r4
          shift: [-0.5sp, 0.5sp]
        - ref: mirror_hand-zone_c1_r1
          shift: [-0.5sp,-0.75sp]
        - ref: mirror_hand-zone_c9_r1
          shift: [0.5sp, -0.5sp]
        - ref: mirror_hand-zone_c9_r1
          shift: [sp, -0.5sp]
        # back to th eoriginal at the bottom
        - ref: hand-zone_c9_r1
          shift: [sp, -0.5sp]
        - ref: hand-zone_c9_r1
          shift: [0.5sp, -0.5sp]

  case:
    - what: outline
      name: pcb_outline
      expand: 9.99   # not 10: maker.js expand breaks one corner at exactly 10 (stray full circle, open outline)
      fillet: 2
  

  case_bottom:  # base plate w mounting cutouts
    - name: case
    - operation: subtract
      name: pcb_mounting
    - operation: subtract
      name: edge_mounting

  # Centre cover (follows cirque_cover), one flat level, flush with the
  # trackpad top (5.4 mm above the PCB, 2.9 mm above the plate):
  #   low layer: plate top -> OLED glass top, pocket for the OLED module
  #   top layer: OLED glass top -> trackpad top, with the screen window
  center_cover_low:
    - name: cirque_cover
    - operation: subtract
      name: cirque_flush
    - operation: subtract
      name: oled
    - operation: subtract
      name: pcb_mounting
    - operation: subtract
      name: reset_hole
    - operation: subtract
      name: indicator_holes
  center_cover_top:
    - name: cirque_cover
    - operation: subtract
      name: cirque_flush
    - operation: subtract
      name: oled_window
    - operation: subtract
      name: pcb_mounting
    - operation: subtract
      name: reset_hole
    - operation: subtract
      name: indicator_holes
  pcb:
    - name: pcb_outline
    - operation: subtract
      name: pcb_mounting
    - operation: subtract
      name: stud_holes
    - operation: subtract
      name: cirque_connector
    - operation: subtract
      name: trackpad_risers

  # ---- 3D case helper outlines ----
  case_wall:
    - name: case
    - operation: subtract
      name: pcb_outline
    - operation: subtract
      name: edge_mounting

  # posts under the PCB, around each pcb_mounting hole (clipped to the PCB outline)
  standoffs_lower:
    - name: pcb_mounting
      expand: 2.5
    - operation: subtract
      name: pcb_mounting
    - operation: intersect
      name: pcb_outline

  # spacers between PCB and switch plate (same positions)
  standoffs_upper:
    - name: pcb_mounting
      expand: 2.5
    - operation: subtract
      name: pcb_mounting
    - operation: intersect
      name: pcb_outline

  # switch plate (lid) with all cutouts
  plate_clean:
    - name: pcb_outline
      expand: 9.99   # not 10: same maker.js corner bug as 'case'
    - operation: subtract
      name: switches_outline
    - operation: subtract
      name: stab_cutouts
    - operation: subtract
      name: edge_mounting
    - operation: subtract
      name: pcb_mounting
    - operation: subtract
      name: cirque_out
    - operation: subtract
      name: oled
    - operation: subtract
      name: reset_cutout
    - operation: subtract
      name: indicator_holes

  # USB-C plug opening through the north case wall, in front of the Helios
  # receptacle (receptacle face ~1 mm inside the PCB edge at y 73.28).
  # 13 mm wide for the plug overmold; cut from y 72 to past the 10 mm wall.
  usb_cutout:
    - what: rectangle
      size: [13, 12.5]
      corner: 1
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [0, 72 + 6.25]
  # trackpad riser columns (case): 0.2 mm smaller than the PCB riser holes
  trackpad_riser_cols:
    - name: trackpad_risers
      expand: -0.2
  # Big rectangles used to split the case into a left and a right half.
  # They are centred on the mirror axis (the middle of the two c9_r2 keys).
  cut_left:
    - what: rectangle
      size: [600, 600]
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [-300, 0]
  cut_right:
    - what: rectangle
      size: [600, 600]
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [300, 0]


cases:
  # Z stack-up (mm): bottom 3.0 | under-PCB clearance 5.5 (Helios 1.6 board +
  # ~3.3 USB-C receptacle hang below the PCB) | PCB 1.6 | gap to plate 1.3 |
  # plate 1.2  -> plate top 12.6.  Z (case coords): floor top 3, PCB bottom
  # 8.5, PCB top 10.1, plate 11.4-12.6, OLED glass top 13.95, trackpad top 15.5.
  # Every printed part is clipped to the "case" outline so nothing can stick out
  # past the case edge, then cut in half on the mirror axis.
  #
  # Tub = bottom plate + walls + screw posts + screwless support studs
  # (5 mm post to the PCB, 2.5 mm pin through the PCB up to the plate) +
  # trackpad riser columns (through the PCB up to the trackpad underside,
  # 4.4 mm above the PCB top), with the USB-C plug opening in the north wall.
  tub_left:
    - name: case_bottom
      extrude: 3
    - name: case_wall
      shift: [0, 0, 3]
      extrude: 8.4
    - name: standoffs_lower
      shift: [0, 0, 3]
      extrude: 5.5
    - name: stud_base
      shift: [0, 0, 3]
      extrude: 5.5
    - name: stud_pin
      shift: [0, 0, 8.5]
      extrude: 2.9
    - name: trackpad_riser_cols
      shift: [0, 0, 3]
      extrude: 11.5
    - name: usb_cutout
      operation: subtract
      shift: [0, 0, 1.5]   # plug axis ~3.2 below the PCB bottom, +-3.75
      extrude: 7.5
    - name: case
      operation: intersect
      extrude: 30
    - name: cut_left
      operation: intersect
      extrude: 30
  tub_right:
    - name: case_bottom
      extrude: 3
    - name: case_wall
      shift: [0, 0, 3]
      extrude: 8.4
    - name: standoffs_lower
      shift: [0, 0, 3]
      extrude: 5.5
    - name: stud_base
      shift: [0, 0, 3]
      extrude: 5.5
    - name: stud_pin
      shift: [0, 0, 8.5]
      extrude: 2.9
    - name: trackpad_riser_cols
      shift: [0, 0, 3]
      extrude: 11.5
    - name: usb_cutout
      operation: subtract
      shift: [0, 0, 1.5]
      extrude: 7.5
    - name: case
      operation: intersect
      extrude: 30
    - name: cut_right
      operation: intersect
      extrude: 30

  lid_left:    # switch plate + upper spacers (print plate-side down)
    - name: plate_clean
      shift: [0, 0, 11.4]
      extrude: 1.2
    - name: standoffs_upper
      shift: [0, 0, 10.1]
      extrude: 1.3
    - name: case
      operation: intersect
      extrude: 30
    - name: cut_left
      operation: intersect
      extrude: 30
  lid_right:
    - name: plate_clean
      shift: [0, 0, 11.4]
      extrude: 1.2
    - name: standoffs_upper
      shift: [0, 0, 10.1]
      extrude: 1.3
    - name: case
      operation: intersect
      extrude: 30
    - name: cut_right
      operation: intersect
      extrude: 30

  # Centre cover (print separately, sits on the plate, screwed through the
  # 4 holes around the trackpad): low layer plate top -> OLED glass top
  # (pocket for the OLED module), top layer -> flush with the trackpad top.
  center_cover:
    - name: center_cover_low
      shift: [0, 0, 12.6]
      extrude: 1.35
    - name: center_cover_top
      shift: [0, 0, 13.95]
      extrude: 1.55

  assembly:    # whole case in one piece, for checking only
    - name: case_bottom
      extrude: 3
    - name: case_wall
      shift: [0, 0, 3]
      extrude: 8.4
    - name: standoffs_lower
      shift: [0, 0, 3]
      extrude: 5.5
    - name: stud_base
      shift: [0, 0, 3]
      extrude: 5.5
    - name: stud_pin
      shift: [0, 0, 8.5]
      extrude: 2.9
    - name: trackpad_riser_cols
      shift: [0, 0, 3]
      extrude: 11.5
    - name: standoffs_upper
      shift: [0, 0, 10.1]
      extrude: 1.3
    - name: plate_clean
      shift: [0, 0, 11.4]
      extrude: 1.2
    - name: center_cover_low
      shift: [0, 0, 12.6]
      extrude: 1.35
    - name: center_cover_top
      shift: [0, 0, 13.95]
      extrude: 1.55
    - name: usb_cutout
      operation: subtract
      shift: [0, 0, 1.5]
      extrude: 7.5
    - name: case
      operation: intersect
      extrude: 30

pcbs:
  kugo80:
    template: kicad8

    outlines:
      main:
        outline: pcb
    footprints:
      # Custom footprint "ks33_hotswap" is NOT defined in this file.
      # It comes from ks33_hotswap.js (web UI: Injections -> footprint named
      # ks33_hotswap; CLI: footprints/ks33_hotswap.js next to this config).

      # One-sided socket, identical orientation on every key of the board.
      # side B = socket on the underside of the PCB (use F for the top face).
      # Pin/pad positions checked against the Gateron switch + socket STEP models.
      keys:
        what: ks33_hotswap
        where: true
        params:
          side: B
          width: "{{keycap_u}}"    # 2 on the stabilized keys
          stab: "{{stab}}"         # PCB cutouts for the KS-57 stabilizer
          from: "{{column_net}}"   # C1..C9, shared by left key and mirrored key
          to: "{{colrow}}"         # unique per key (left and right differ)

      # Diodes (SOD-123, pad 1 = cathode = row, COL2ROW): key -> row. Left half uses R1..R5, right half R6..R10.
      diode_left:
        what: sod123
        where: /^hand-zone_/      # left half only
        params:
          from: "{{colrow}}"
          to: "{{row_net}}"
        adjust:
          shift: [7.5, 0]   # right of the switch, above socket pad 2
          rotate: 90  # key-side pad points down, towards pad 2
      diode_right:
        what: sod123
        where: /^mirror_hand-zone_/   # right (mirrored) half only
        params:
          from: "{{colrow}}"
          to: "{{row_net_r}}"
        adjust:
          shift: [-7.5, 0]  # mirror negates x/rotation -> same spot as the left half
          rotate: -90

      # LEDs, one data chain through all 80 keys:
      # LED_IND_IN -> 2 indicators -> LED_DATA -> left c1 ... left c9 -> right c9 ... right c1 -> LED_END
      # SK6812MINI-E (footprints/sk6812mini_e.js), params by function; VDD/GND default to VCC/GND
      leds_left:
        what: sk6812mini_e
        where: /^hand-zone_/      # left half only
        adjust:
          shift: [-0.69, 5.16]   # centre of the KS-33 light window (top view)
          rotate: 180
        params:
          side: B               # back-mounted, light passes through a PCB cutout
          DOUT: "{{led_l_out}}"
          DIN: "{{led_l_in}}"
      leds_right:
        what: sk6812mini_e
        where: /^mirror_hand-zone_/   # right (mirrored) half only
        adjust:
          shift: [0.69, 5.16]    # mirror negates x -> same window position (-0.69)
          rotate: 180
        params:
          side: B               # back-mounted, light passes through a PCB cutout
          DOUT: "{{led_r_out}}"
          DIN: "{{led_r_in}}"

      # LED decoupling caps (100 nF 0603), one per key, VCC -> GND,
      # on the back next to each LED (left of it, between LED and diode).
      # y follows the LED of the same half.
      caps_left:
        what: c_0603
        where: /^hand-zone_/      # left half only
        adjust:
          shift: [-6, 5.16]
          rotate: 90
        params:
          side: B
          from: VCC
          to: GND
      caps_right:
        what: c_0603
        where: /^mirror_hand-zone_/   # right (mirrored) half only
        adjust:
          shift: [-6, 5.16]
          rotate: 90
        params:
          side: B
          from: VCC
          to: GND

      # Helios (RP2040) MCU on the back, component side facing down, USB-C at
      # the top edge of the board (centre, under the OLED area). side B mirrors
      # the pinout because the module is turned over. Pads -> GPIO: see
      # footprints/helios.js. Spare: GP13, GP14, GP15 (P26-P28, under the OLED header).
      mcu:
        what: helios
        where:
          aggregate.parts:
            - hand-zone_c9_r2
            - mirror_hand-zone_c9_r2
          rotate: 0
          shift: [0, 54.7]       # module edge (USB end) 0.6 mm inside the PCB top edge
        params:
          side: B
          # rows, left half -> pins on the left side once turned over
          P17: R1              # GP29
          P18: R2              # GP28
          P19: R3              # GP27
          P20: R4              # GP26
          P21: R5              # GP22
          # rows, right half -> pins on the right side
          P7: R6               # GP4
          P8: R7               # GP5
          P9: R8               # GP6
          P10: R9              # GP7
          P11: R10             # GP8
          # columns (shared by both halves)
          # (bottom row kept free under the OLED header, except the outer pads)
          P1: C1               # GP0
          P2: C2               # GP1
          P31: C3              # GP10
          P30: C4              # GP11
          P29: C5              # GP16
          P25: CIRQUE_DR       # GP12, trackpad "data ready" (optional in QMK)
          P12: C6              # GP9
          P24: C7              # GP21
          P23: C8              # GP23
          P22: C9              # GP20
          # RGB data (5 V level-shifted output), I2C for OLED + Cirque (shared bus)
          P34: LED_DATA_MCU    # GP25 -> series resistor R1 -> LED_DATA
          P5: SDA              # GP2
          P6: SCL              # GP3

      # LED data series resistor (330 R) right at the MCU: damps ringing on the
      # long data line to the first LED and protects GP25. On the back, just
      # below the Helios' bottom castellations.
      led_data_res:
        what: r_0603
        where:
          aggregate.parts:
            - hand-zone_c9_r2
            - mirror_hand-zone_c9_r2
          rotate: 0
          shift: [8.8, 37.36]
        params:
          side: B
          value: 330
          from: LED_DATA_MCU
          to: LED_IND_IN       # -> 2 indicator LEDs -> LED_DATA -> key LEDs

      # Indicator LEDs = first 2 LEDs of the RGB chain (QMK index 0, 1),
      # back-mounted like the key LEDs, shining through the indicator_holes.
      # Halfway between the Helios and the C8R5 keycap, level with the
      # c9 screw holes (y 61.07). Caps Lock is shown on the Caps Lock key LED.
      #   0 right: function/layer lock (green)
      #   1 left:  active layout layer (any colour)
      indicator_fn:   # QMK LED 0
        what: sk6812mini_e
        where:
          aggregate.parts:
            - hand-zone_c9_r2
            - mirror_hand-zone_c9_r2
          rotate: 0
          shift: [25.3, 61.07]
        params:
          side: B
          DIN: LED_IND_IN
          DOUT: LED_IND_1
      indicator_layer:   # QMK LED 1
        what: sk6812mini_e
        where:
          aggregate.parts:
            - hand-zone_c9_r2
            - mirror_hand-zone_c9_r2
          rotate: 0
          shift: [-25.3, 61.07]
        params:
          side: B
          DIN: LED_IND_1
          DOUT: LED_DATA
      # 100 nF decoupling, 5 mm beside each LED towards the Helios
      indicator_fn_cap:
        what: c_0603
        where:
          aggregate.parts:
            - hand-zone_c9_r2
            - mirror_hand-zone_c9_r2
          rotate: 90
          shift: [25.3 - 5, 61.07]
        params:
          side: B
          from: VCC
          to: GND
      indicator_layer_cap:
        what: c_0603
        where:
          aggregate.parts:
            - hand-zone_c9_r2
            - mirror_hand-zone_c9_r2
          rotate: 90
          shift: [-25.3 + 5, 61.07]
        params:
          side: B
          from: VCC
          to: GND

      # Bulk capacitor (10 uF) on the LED supply where 5 V enters, next to the
      # Helios' 5V and GND castellations (west side). The 80 per-LED 100 nF
      # caps handle the fast spikes, this one the overall current steps.
      led_bulk_cap:
        what: c_0805
        where:
          aggregate.parts:
            - hand-zone_c9_r2
            - mirror_hand-zone_c9_r2
          rotate: 90
          shift: [-12.6, 68.66]
        params:
          side: B
          value: 10uF
          from: VCC
          to: GND

      # 0.96" OLED (SSD1306, I2C) on the top side, rotated 180 deg: header at the
      # bottom edge, just below the Helios' castellations; the module sits in the
      # plate cutout (outline 'oled'), raised on its header. Display content is
      # rotated in firmware. No corner holes (the Helios is underneath them).
      oled:
        what: oled_i2c
        where:
          aggregate.parts:
            - hand-zone_c9_r2
            - mirror_hand-zone_c9_r2
          rotate: 180
          shift: [0, 33.3]
        params:
          side: F
          holes: false
          GND: GND
          VDD: 3V3
          SCL: SCL
          SDA: SDA

      # Molex 505278 FFC connector for the Cirque TM040040 (I2C mode, R1 removed
      # on the trackpad), on the back, NORTH of the FFC slot, opening facing
      # south towards it. Cable route for a 50 mm FFC: down from the trackpad's
      # vertical connector through the slot (y -17.4), 90 deg bend, then flat
      # under the PCB ~39 mm north into this connector (no folds, no twist).
      # Straight cable, so trackpad pin n lands on Molex pin n:
      #   1 SCK 2 MISO 3 SS 4 DR 5 MOSI 6 BTN2 7 BTN3 8 BTN1
      #   9 SCL 10 SDA 11 GND 12 VDD(3.3 V)
      # Cable type: the face touching the contacts here (towards the PCB) is the
      # face pointing at the trackpad centre at the other end -> "same side"
      # FFC if the trackpad connector's contacts are on its inner wall,
      # "opposite side" if on the outer wall. Verify pin 1 on the real part.
      trackpad_conn:
        what: molex_505278
        where:
          aggregate.parts:
            - hand-zone_c9_r2
            - mirror_hand-zone_c9_r2
          rotate: 0
          shift: [0, 25.2]
        params:
          side: B
          P1: TP_SCK           # trackpad 1 (SPI only)
          P2: TP_MISO          # trackpad 2 (SPI only)
          P3: TP_SS            # trackpad 3 (SPI only)
          P4: CIRQUE_DR        # trackpad 4 DR -> GP12
          P5: TP_MOSI          # trackpad 5 (SPI only)
          P6: TP_BTN2          # trackpad 6 (unused)
          P7: TP_BTN3          # trackpad 7 (unused)
          P8: TP_BTN1          # trackpad 8 (unused)
          P9: SCL              # trackpad 9 SCL
          P10: SDA             # trackpad 10 SDA
          P11: GND             # trackpad 11 GND
          P12: 3V3             # trackpad 12 VDD
          MP: GND

      # Cirque TM040040 trackpad: 3D model only (it is cabled, not soldered).
      # Its PCB sits 4.4 mm above the keyboard PCB on the 4 risers, so the
      # 4.1 mm of components underneath clear the board. Model is 5.15 mm
      # thick with its origin mid-height: z offset = 4.4 - (2.6 - 0.99) = 2.79.
      trackpad_model:
        what: mech_model
        where:
          aggregate.parts:
            - hand-zone_c9_r2
            - mirror_hand-zone_c9_r2
          rotate: 0
          shift: [0, -2]
        params:
          label: TM040040
          model: ${KIPRJMOD}/../../3dmodels/Cirque_TM040040.step
          model_offset: [0, 0, 2.79]

      # Reset button: RST -> GND (double-tap for the RP2040 bootloader in QMK).
      # Pressed through the reset_hole in the centre cover; plate has reset_cutout.
      reset_button:
        what: ts1187a
        where: /^hand-zone_c8_r5$/
        adjust:
          shift: [0.5kc + 5, -(sp - 0.5kc) - 0.25sp + 5]
        params:
          side: F
          from: RST
          to: GND
