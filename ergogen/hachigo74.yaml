  # Silkscreen markers of every case support touching the PCB, so they show in
  # KiCad: back = screw posts + lower crosses, front = OLED spacers + trackpad outline. Built from the
  # same outlines the case uses, so they always match.
  support_marks_back:
    - name: insert_post
    - operation: add
      name: cross_lower
  support_marks_front:
    - name: oled_spacer_disc
    - operation: add
      name: cover_south_spacer    # (same place and size as the cover's old south bosses)
    - operation: add
      name: cross_upper
    - operation: add       # trackpad outline
      name: tp_outline
    - operation: add
      name: tp_support

  # switch plate (lid) with all cutouts
  plate_clean:
    - name: case
    - operation: subtract
      name: switches_outline
    - operation: subtract
      name: stab_cutouts
    - operation: subtract
      name: edge_mounting
    - operation: subtract
      name: pcb_mounting
    - operation: subtract
      name: tp_plate_opening      # under the trackpad's parts zone
    - operation: subtract
      name: oled_plate
    - operation: subtract
      name: lid_clip_notch        # the cover's T clip stem
    - operation: subtract
      name: indicator_holes

  # Ribs under the plate round every switch (user 2026-11-04: part of the final lids), z 10.4-11.4,
  # 0.3 above the PCB. Relief 1 round the cutout so switches and stabilizers still snap in, frame
  # 1.5 round that (1.55 here: neighbours overlap by 0.1, as touching edges are fragile in maker.js;
  # between keys the web is 2.9 wide whatever the frame). 2U: round switch + stabilizer housings (Gateron's STEP, in the band: x +-15, y -9.74 .. 7.05).
  # Kept 0.5 inside the PCB outline (clear of the tub wall), with the plate's own holes cut through.
  rib_frames:
    - what: rectangle
      where: -/_c5_r1$/
      size: [sw + 5.1, sw + 5.1]
    - what: rectangle
      where: /_c5_r1$/
      size: [35.1, 21.9]
      adjust.shift: [0, -1.35]
  rib_relief:
    - what: rectangle
      where: -/_c5_r1$/
      size: [sw + 2, sw + 2]
    - what: rectangle
      where: /_c5_r1$/
      size: [32, 18.8]
      adjust.shift: [0, -1.35]
  rib_region:
    - name: pcb_core
      expand: 1.5
  plate_ribs:
    - name: rib_frames
    - operation: subtract
      name: rib_relief
    - operation: intersect
      name: rib_region
    - operation: intersect
      name: plate_clean

  # USB-C plug opening through the north case wall, in front of the Helios
  # receptacle (receptacle face ~1 mm inside the PCB edge at y 73.28).
  # 13 mm wide for the plug overmold; cut from y 72 to past the 10 mm wall.
  usb_cutout:
    - what: rectangle
      size: [13, 12.5]
      corner: 1
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [0, 72 + 6.25]
  # Big rectangles used to split the case into a left and a right half.
  # They are centred on the mirror axis (the middle of the two c9_r2 keys).
  cut_left:
    - what: rectangle
      size: [600, 600]
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [-300, 0]
  cut_right:
    - what: rectangle
      size: [600, 600]
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [300, 0]

  # Tilt wedge (tools/lib/wedge_case.py) locating columns: 4 per half under the tub,
  # at key centres clear of the floor screws and reset pin. The tub floor gets a socket
  # (6.4, 1.1 deep) for the wedge's 6.0 x 1.0 column and above it a pocket for a
  # 3 x 1 mm magnet (3.2, to 2.2 deep: 0.8 mm floor left); the column has the same
  # magnet pocket in its top. Glue the magnets in with opposite poles facing.
  wedge_socket:
    - what: circle
      radius: 3.2
      where: hand-zone_c4_r4
    - what: circle
      radius: 3.2
      where: hand-zone_c3_r2
    - what: circle
      radius: 3.2
      where: hand-zone_c8_r4
    - what: circle
      radius: 3.2
      where: hand-zone_c8_r2
    - what: circle
      radius: 3.2
      where: mirror_hand-zone_c4_r4
    - what: circle
      radius: 3.2
      where: mirror_hand-zone_c3_r2
    - what: circle
      radius: 3.2
      where: mirror_hand-zone_c8_r4
    - what: circle
      radius: 3.2
      where: mirror_hand-zone_c8_r2
  wedge_magnet:
    - what: circle
      radius: 1.6
      where: hand-zone_c4_r4
    - what: circle
      radius: 1.6
      where: hand-zone_c3_r2
    - what: circle
      radius: 1.6
      where: hand-zone_c8_r4
    - what: circle
      radius: 1.6
      where: hand-zone_c8_r2
    - what: circle
      radius: 1.6
      where: mirror_hand-zone_c4_r4
    - what: circle
      radius: 1.6
      where: mirror_hand-zone_c3_r2
    - what: circle
      radius: 1.6
      where: mirror_hand-zone_c8_r4
    - what: circle
      radius: 1.6
      where: mirror_hand-zone_c8_r2

  # Joint between the tubs (user 2026-11-03): dovetails, tails on the right tub, sockets in the
  # left one, engaged by dropping one half straight down (the tubs go together before the PCB).
  # Floor tails (z 0-3): y clear of the counterbores (+-11, -29.5 / 24.1) and the reset pin
  # (-4.9, 44.1). South wall tail (z 0-11.4): centred in the 8 mm wall. Sockets 0.1 larger per side (0.15 printed too loose).
  dovetail_floor:
    - what: polygon
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [0, 60]
      points:
        - shift: [0.5, -4]    # root 0.5 inside the right tub (fuses with it)
        - shift: [-8.5, -2]
        - shift: [0, 12]
        - shift: [8.5, -2]
    - what: polygon
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [0, 32]
      points:
        - shift: [0.5, -4]    # root 0.5 inside the right tub (fuses with it)
        - shift: [-8.5, -2]
        - shift: [0, 12]
        - shift: [8.5, -2]
    - what: polygon
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [0, -4]
      points:
        - shift: [0.5, -4]    # root 0.5 inside the right tub (fuses with it)
        - shift: [-8.5, -2]
        - shift: [0, 12]
        - shift: [8.5, -2]
  dovetail_wall:
    - what: polygon
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [0, -39.195]    # centred in the 7.75 wall
      points:
        - shift: [0.5, -2]    # root 0.5 inside the right tub (fuses with it)
        - shift: [-6.5, -0.8]
        - shift: [0, 5.6]
        - shift: [6.5, -0.8]
  dovetail_floor_socket:
    - name: dovetail_floor
      expand: 0.1
      joints: pointy
  dovetail_wall_socket:
    - name: dovetail_wall
      expand: 0.1
      joints: pointy

  cut_right_tails:     # the right tub's cut: its half plus the tails (cut from the floor and the wall)
    - name: cut_right
    - operation: add
      name: dovetail_floor
    - operation: add
      name: dovetail_wall

  # Bridge plate on the tub floor across the joint (user 2026-11-03; separate part, z 3-4.5, glue
  # optional): y -34.8 (0.27 off the south wall) .. 60 (short of the USB receptacle, whose bottom is
  # z 3.6). Close holes around the 4 centre posts (5.5 + 0.2) tie the halves together without glue.
  bridge_post_hole:
    - name: cover_screw
      expand: 1.65
  bridge_inside:    # 0.75 clear of the tub walls
    - name: pcb_outline
      expand: -0.5
  center_bridge:
    - what: rectangle       # +-69: 0.7 clear of the crosses at c4_r1 / mirror
      size: [138, 240]
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [0, 0]
    - operation: intersect
      name: bridge_inside
    - what: rectangle       # stays south of the USB plug (y 60)
      size: [20, 100]
      operation: subtract
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [0, 110]
    - operation: subtract
      name: bridge_post_hole
    - what: circle
      radius: 1.8           # around the reset boss (r 1.6)
      operation: subtract
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [-4.885, 44.10]
    - what: rectangle       # slot for the OLED's 4 header pins (x +-4.13, y 23.5, down to z 3.3 if uncut)
      size: [11, 3]
      operation: subtract
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [0, 23.5]

cases:
  # Z stack-up (mm): bottom 3.0 | under-PCB clearance 5.5 (Helios 1.6 board +
  # ~3.3 USB-C receptacle hang below the PCB) | PCB 1.6 | gap to plate 1.3 |
  # plate 1.2  -> plate top 12.6.  Z (case coords): floor top 3, PCB bottom
  # 8.5, PCB top 10.1, plate 11.4-12.6, OLED glass top 14.3 (spacer 1.1), cover pocket ceiling 14.5, cover top 15.5,
  # trackpad 12.6-17.6 on the plate (5 mm, user measured; connector down to 10.1), ring lip 17.7-18.5.
  # Every printed part is clipped to the "case" outline so nothing can stick out
  # past the case edge, then cut in half on the mirror axis.
  #
  # Tub = bottom plate + walls + screw posts + the reset pin boss, with the USB-C plug opening in the north wall.
  # The trackpad lies on the plate, the centre cover carries its anti-rotation
  # peg, the separate trackpad_ring part snaps into the cover.
  tub_left:
    - name: case_bottom
      extrude: 3
    - name: case_wall
      shift: [0, 0, 3]
      extrude: 8.4
    - name: standoffs_lower
      shift: [0, 0, 3]
      extrude: 5.5
    - name: cross_lower
      shift: [0, 0, 3]
      extrude: 5.5     # floor top -> PCB bottom
    - name: mcu_reset_boss
      shift: [0, 0, 3]
      extrude: 1.8
    - name: usb_cutout
      operation: subtract
      shift: [0, 0, 3]     # floor stays 3 thick; open up to the wall top z 11.4, the plate covers it (plug axis ~3.2 below the PCB bottom)
      extrude: 8.4
    - name: cover_counterbore
      operation: subtract
      shift: [0, 0, 0]
      extrude: 1.6     # screw heads of the bottom-up cover screws
    - name: wedge_socket
      operation: subtract
      shift: [0, 0, 0]
      extrude: 1.1     # tilt wedge column socket
    - name: wedge_magnet
      operation: subtract
      shift: [0, 0, 0]
      extrude: 2.2     # 3 x 1 magnet above the socket (glued)
    - name: case
      operation: intersect
      extrude: 30
    - name: dovetail_floor_socket
      operation: subtract
      extrude: 3       # sockets for the right tub's tails
    - name: dovetail_wall_socket
      operation: subtract
      extrude: 12
    - name: cut_left
      operation: intersect
      extrude: 30
  tub_right:
    - name: case_bottom
      extrude: 3
    - name: case_wall
      shift: [0, 0, 3]
      extrude: 8.4
    - name: standoffs_lower
      shift: [0, 0, 3]
      extrude: 5.5
    - name: cross_lower
      shift: [0, 0, 3]
      extrude: 5.5     # floor top -> PCB bottom
    - name: mcu_reset_boss
      shift: [0, 0, 3]
      extrude: 1.8
    - name: usb_cutout
      operation: subtract
      shift: [0, 0, 3]
      extrude: 8.4
    - name: cover_counterbore
      operation: subtract
      shift: [0, 0, 0]
      extrude: 1.6
    - name: wedge_socket
      operation: subtract
      shift: [0, 0, 0]
      extrude: 1.1     # tilt wedge column socket
    - name: wedge_magnet
      operation: subtract
      shift: [0, 0, 0]
      extrude: 2.2     # 3 x 1 magnet above the socket (glued)
    - name: case
      operation: intersect
      extrude: 30
    - name: cut_right_tails  # the cut line, plus the tails reaching past it into the left tub
      operation: intersect
      extrude: 30

  lid_left:    # switch plate + upper spacers (print plate-side down)
    - name: plate_clean
      shift: [0, 0, 11.4]
      extrude: 1.2
    - name: standoffs_upper
      shift: [0, 0, 10.1]
      extrude: 1.3
    - name: cross_upper
      shift: [0, 0, 10.1]
      extrude: 1.3     # PCB top -> plate underside
    - name: plate_ribs
      shift: [0, 0, 10.4]
      extrude: 1       # ribs under the plate
    - name: tp_support
      shift: [0, 0, 10.1]
      extrude: 1.3     # ring under the trackpad's rim, plate to PCB top
    - name: case
      operation: intersect
      extrude: 30
    - name: cut_left
      operation: intersect
      extrude: 30
  lid_right:
    - name: plate_clean
      shift: [0, 0, 11.4]
      extrude: 1.2
    - name: standoffs_upper
      shift: [0, 0, 10.1]
      extrude: 1.3
    - name: cross_upper
      shift: [0, 0, 10.1]
      extrude: 1.3     # PCB top -> plate underside
    - name: plate_ribs
      shift: [0, 0, 10.4]
      extrude: 1       # ribs under the plate
    - name: tp_support
      shift: [0, 0, 10.1]
      extrude: 1.3     # ring under the trackpad's rim, plate to PCB top
    - name: case
      operation: intersect
      extrude: 30
    - name: cut_right
      operation: intersect
      extrude: 30

  # Centre cover (print separately, sits on the plate, screwed through the
  # 4 holes around the trackpad): low layer plate top -> OLED glass top
  # (pocket for the OLED module), top layer -> z 15.5 with the trackpad recess; the
  # collar the trackpad ring screws onto (M50x1.5 thread in Fusion).
  center_cover:
    - name: center_cover_low
      shift: [0, 0, 12.6]
      extrude: 1.9     # pocket ceiling 14.5: OLED module top 14.3 (spacer 1.1 + 3.1 measured); pad ledge at 14.5
    - name: center_cover_top
      shift: [0, 0, 14.5]
      extrude: 1
    - name: tp_ring_seat     # seat under the ring, z 15.5-16.2 (user 2026-11-06: up to the sleeve's end / flange top)
      shift: [0, 0, 15.5]
      extrude: 0.7
    - name: tp_collar        # collar for the screw-on ring, z 15.5-18.7 (thread 16.2-18.7 above the seat, 2.5)
      shift: [0, 0, 15.5]
      extrude: 3.2
    - name: tp_notch_pin     # anti-rotation pin in the overlay's notch, on the ledge (z 14.5-16.0)
      shift: [0, 0, 14.5]
      extrude: 1.5
    # (no OLED bosses since 2026-11-07, user: the module is held by its header and the pin spacers)
    - name: pcb_mounting_std # south screws, top-down: 2.4 through the cover
      operation: subtract
      shift: [0, 0, 12.6]
      extrude: 2.9
    - name: cover_south_cbore
      operation: subtract
      shift: [0, 0, 14.5]
      extrude: 1       # head counterbore 14.5-15.5 (user: 1 deep, 1.9 under the head; a 2.0 tall head stands 1.0 proud)
    - name: cover_clip_socket # the T clip's stem, glued (z 12.6-14.1)
      operation: subtract
      shift: [0, 0, 12.6]
      extrude: 1.5

  # Screw-on trackpad ring (print separately, top up: its bottom is flat, the top has the 4 x 1
  # fillet): internal M50x1.5 thread (Fusion) onto the cover's collar; its sleeve presses the
  # overlay's flange. Shown screwed down onto the pad (sleeve on the flange top z 16.2); its
  # bottom then sits on the seat (z 16.2) too.
  trackpad_ring:
    - name: tp_ring_body
      shift: [0, 0, 16.2]
      extrude: 3.3     # thread part, z 16.2-19.5 (user 2026-11-06: bottom level with the sleeve's end, was 15.75)
    - name: tp_ring_lip
      shift: [0, 0, 18.9]
      extrude: 1.4     # solid top (user 2026-11-06): z 18.9-20.3, 0.2 over the collar's top (18.7), so the
                       # internal thread stops there and the top edge can take a chamfer (Fusion: ring_chamfer_h 3 / ring_chamfer_v 1);
                       # the lip proper (z 19.5-20.3) stays outside the pad's 43.86 top face
    - name: tp_ring_sleeve
      shift: [0, 0, 16.2]
      extrude: 3.3     # sleeve down onto the flange (z 16.2-19.5)

  # T clip under the plates at the cover's north edge (print lying on its south face, the T on the bed)
  cover_clip:
    - name: cover_clip_bar
      shift: [0, 0, 10.45]
      extrude: 0.8     # z 10.45-11.25 under the plates
    - name: cover_clip_stem
      shift: [0, 0, 11.25]
      extrude: 2.75    # z 11.25-14.0, through the plates' notch into the cover (socket to 14.1)

  # Bridge plate across the joint, on the tub floor (around the centre posts, glue optional)
  center_bridge:
    - name: center_bridge
      shift: [0, 0, 3]
      extrude: 1.5

  # 2 spacers for the OLED screws (PCB top -> module underside, 1.1 mm, 5.5 mm dia;
  # user 2026-11-07: 1.1 like the spacers in case/fusion/spacers.f3d, was 1.2)
  oled_spacers:
    - name: oled_spacer
      shift: [0, 0, 10.1]
      extrude: 1.1

  assembly:    # whole case in one piece, for checking only
    - name: case_bottom
      extrude: 3
    - name: case_wall
      shift: [0, 0, 3]
      extrude: 8.4
    - name: standoffs_lower
      shift: [0, 0, 3]
      extrude: 5.5
    - name: cross_lower
      shift: [0, 0, 3]
      extrude: 5.5     # floor top -> PCB bottom
    - name: mcu_reset_boss
      shift: [0, 0, 3]
      extrude: 1.8
    - name: standoffs_upper
      shift: [0, 0, 10.1]
      extrude: 1.3
    - name: cross_upper
      shift: [0, 0, 10.1]
      extrude: 1.3     # PCB top -> plate underside
    - name: plate_clean
      shift: [0, 0, 11.4]
      extrude: 1.2
    - name: plate_ribs
      shift: [0, 0, 10.4]
      extrude: 1       # ribs under the plate
    - name: tp_support
      shift: [0, 0, 10.1]
      extrude: 1.3     # ring under the trackpad's rim, plate to PCB top
    - name: center_cover_low
      shift: [0, 0, 12.6]
      extrude: 1.9     # pocket ceiling 14.5: OLED module top 14.3 (spacer 1.1 + 3.1 measured)
    - name: center_cover_top
      shift: [0, 0, 14.5]
      extrude: 1
    - name: tp_ring_seat
      shift: [0, 0, 15.5]
      extrude: 0.7
    - name: tp_collar
      shift: [0, 0, 15.5]
      extrude: 3.2
    - name: tp_notch_pin
      shift: [0, 0, 14.5]
      extrude: 1.5
    - name: tp_ring_body
      shift: [0, 0, 16.2]
      extrude: 3.3
    - name: tp_ring_sleeve
      shift: [0, 0, 16.2]
      extrude: 3.3
    - name: tp_ring_lip
      shift: [0, 0, 18.9]
      extrude: 1.4
    - name: cover_clip_bar
      shift: [0, 0, 10.45]
      extrude: 0.8
    - name: cover_clip_stem
      shift: [0, 0, 11.25]
      extrude: 2.75
    - name: usb_cutout
      operation: subtract
      shift: [0, 0, 3]
      extrude: 8.4     # opening z 3-11.4, as in the tubs
    - name: case
      operation: intersect
      extrude: 30

pcbs:
  hachigo74:
    template: kicad8

    outlines:
      main:
        outline: pcb
      support_marks_back:
        outline: support_marks_back
        layer: B.SilkS
      support_marks_front:
        outline: support_marks_front
        layer: F.SilkS
    footprints:
      # Custom footprint "ks33_hotswap" is NOT defined in this file.
      # It comes from ks33_hotswap.js (web UI: Injections -> footprint named
      # ks33_hotswap; CLI: footprints/ks33_hotswap.js next to this config).

      # One-sided socket, identical orientation on every key of the board.
      # side B = socket on the underside of the PCB (use F for the top face).
      # Pin/pad positions checked against the Gateron switch + socket STEP models.
      keys:
        what: ks33_hotswap
        where: true
        params:
          side: B
          width: "{{keycap_u}}"    # 2 on the stabilized keys
          stab: "{{stab}}"         # PCB cutouts for the KS-57 stabilizer
          from: "{{column_net}}"   # C1..C9, shared by left key and mirrored key
          to: "{{colrow}}"         # unique per key (left and right differ)

      # Diodes (SOD-123, pad 1 = cathode = row, COL2ROW): key -> row. Left half uses R1..R5, right half R6..R10.
      diode_left:
        what: sod123
        where: /^hand-zone_/      # left half only
        params:
          from: "{{colrow}}"
          to: "{{row_net}}"
        adjust:
          shift: [7.5, 0]   # right of the switch, above socket pad 2
          rotate: 90  # key-side pad points down, towards pad 2
      diode_right:
        what: sod123
        where: /^mirror_hand-zone_/   # right (mirrored) half only
        params:
          from: "{{colrow}}"
          to: "{{row_net_r}}"
        adjust:
          shift: [-7.5, 0]  # mirror negates x/rotation -> same spot as the left half
          rotate: -90

      # LEDs, one data chain through all 80 keys:
      # LED_IND_IN -> 2 indicators -> LED_DATA -> left c1 ... left c9 -> right c9 ... right c1 -> LED_END
      # SK6812MINI-E (footprints/sk6812mini_e.js), params by function; VDD/GND default to VCC/GND
      leds_left:
        what: sk6812mini_e
        where: /^hand-zone_/      # left half only
        adjust:
          shift: [-0.69, 5.16]   # centre of the KS-33 light window (top view)
          rotate: 180
        params:
          side: B               # back-mounted, light passes through a PCB cutout
          DOUT: "{{led_l_out}}"
          DIN: "{{led_l_in}}"
      leds_right:
        what: sk6812mini_e
        where: /^mirror_hand-zone_/   # right (mirrored) half only
        adjust:
          shift: [0.69, 5.16]    # mirror negates x -> same window position (-0.69)
          rotate: 180
        params:
          side: B               # back-mounted, light passes through a PCB cutout
          DOUT: "{{led_r_out}}"
          DIN: "{{led_r_in}}"

      # LED decoupling caps (100 nF 0603), one per key, VCC -> GND,
      # on the back next to each LED (left of it, between LED and diode).
      # y follows the LED of the same half.
      caps_left:
        what: c_0603
        where: /^hand-zone_/      # left half only
        adjust:
          shift: [-6, 5.16]
          rotate: 90
        params:
          side: B
          from: VCC
          to: GND
      caps_right:
        what: c_0603
        where: /^mirror_hand-zone_/   # right (mirrored) half only
        adjust:
          shift: [-6, 5.16]
          rotate: 90
        params:
          side: B
          from: VCC
          to: GND

      # Helios (RP2040) MCU on the back, component side facing down, USB-C at
      # the top edge of the board (centre, under the OLED area). side B mirrors
      # the pinout because the module is turned over. Pads -> GPIO: see
      # footprints/helios.js. Spare: GP13, GP14, GP15 (P26-P28, under the OLED header).
      mcu:
        what: helios
        where:
          aggregate.parts:
            - hand-zone_c9_r2
            - mirror_hand-zone_c9_r2
          rotate: 0
          shift: [0, 54.7]       # module edge (USB end) 0.6 mm inside the PCB top edge
        params:
          side: B
          # rows, left half -> pins on the left side once turned over
          # (pin map changed 2026-10-20 by the user, for cleaner routing)
          P21: R1              # GP22
          P20: R2              # GP26
          P19: R3              # GP27
          P18: R4              # GP28
          P17: R5              # GP29
          # rows, right half -> pins on the right side
          P9: R6               # GP6
          P8: R7               # GP5
          P7: R8               # GP4
          P2: R9               # GP1
          P1: R10              # GP0
          # columns (shared by both halves)
          P12: C2              # GP9
          P25: C3              # GP12
          P26: C4              # GP13
          P27: C5              # GP14
          P28: C6              # GP15
          P29: C7              # GP16
          P24: C8              # GP21
          P23: C9              # GP23
          P10: CIRQUE_DR       # GP7, trackpad "data ready" (optional in QMK)
          # free: P11 GP8, P22 GP20, P30 GP11, P31 GP10
          # RGB data (5 V level-shifted output), I2C for OLED + Cirque (shared bus)
          P34: LED_DATA_MCU    # GP25 -> series resistor R1 -> LED_DATA
          P5: SDA              # GP2
          P6: SCL              # GP3

      # LED data series resistor (330 R) right at the MCU: damps ringing on the
      # long data line to the first LED and protects GP25. On the back, just
      # below the Helios' bottom castellations.
      led_data_res:
        what: r_0603
        where:
          aggregate.parts:
            - hand-zone_c9_r2
            - mirror_hand-zone_c9_r2
          rotate: 0
          shift: [8.8, 37.36]
        params:
          side: B
          value: 330
          from: LED_DATA_MCU
          to: LED_IND_IN       # -> 2 indicator LEDs -> LED_DATA -> key LEDs

      # Indicator LEDs = first 2 LEDs of the RGB chain (QMK index 0, 1),
      # back-mounted like the key LEDs, shining through the indicator_holes.
      # Where they were next to the c9_r1 keys before the thumb move (anchored on c9_r2;
      # 19.5 mm from the old key centre, 8 mm past the keycap). Caps Lock
      # is shown on the Caps Lock key LED.
      #   0 right: function/layer lock (green)
      #   1 left:  active layout layer (any colour)
      indicator_fn:   # QMK LED 0
        what: sk6812mini_e
        where:
          ref: mirror_hand-zone_c9_r2
          shift: [0.125sp + 19.5, -sp]   # = the old c9_r1 [19.5, 0]
        params:
          side: B
          DIN: LED_IND_IN
          DOUT: LED_IND_1
      indicator_layer:   # QMK LED 1
        what: sk6812mini_e
        where:
          ref: hand-zone_c9_r2
          shift: [0.125sp + 19.5, -sp]   # = the old c9_r1 [19.5, 0]
        params:
          side: B
          DIN: LED_IND_1
          DOUT: LED_DATA
      # 100 nF decoupling, 4 mm south of each LED
      indicator_fn_cap:
        what: c_0603
        where:
          ref: mirror_hand-zone_c9_r2
          shift: [0.125sp + 19.5, -sp - 4]   # = the old c9_r1 [19.5, -4]
          rotate: 0
        params:
          side: B
          from: VCC
          to: GND
      indicator_layer_cap:
        what: c_0603
        where:
          ref: hand-zone_c9_r2
          shift: [0.125sp + 19.5, -sp - 4]   # = the old c9_r1 [19.5, -4]
          rotate: 0
        params:
          side: B
          from: VCC
          to: GND

      # Bulk capacitor (10 uF) on the LED supply where 5 V enters, next to the
      # Helios' 5V and GND castellations (west side). The 80 per-LED 100 nF
      # caps handle the fast spikes, this one the overall current steps.
      led_bulk_cap:
        what: c_0805
        where:
          aggregate.parts:
            - hand-zone_c9_r2
            - mirror_hand-zone_c9_r2
          rotate: 90
          shift: [-12.6, 68.66]
        params:
          side: B
          value: 10uF
          from: VCC
          to: GND

      # 0.96" OLED (SSD1306, I2C) on the top side, rotated 180 deg: header at the
      # bottom edge, close to the trackpad ring; the module sits in the plate
      # cutout (outline 'oled'), raised on its header. Display content is rotated
      # in firmware. Its 2 bottom corner holes take screws (oled_screw); the 2 top
      # ones are free (the Helios castellations are 0.7 mm away, no room for a stud).
      oled:
        what: oled_i2c
        where:
          aggregate.parts:
            - hand-zone_c9_r2
            - mirror_hand-zone_c9_r2
          rotate: 180
          shift: [0, 23.5]   # header row; module up to y 49.3 (9.8 mm south of the old spot)
        params:
          side: F
          holes: false
          GND: GND
          VDD: 3V3
          SCL: SCL
          SDA: SDA

      # Molex 505278 FFC connector for the Cirque TM040040 (I2C mode, R1 removed
      # on the trackpad), on the back, NORTH of the FFC slot, opening facing
      # south towards it. Cable route for a 30 mm FFC (pad raised 7.1 mm to
      # keycap height, connector moved 7.1 mm south to keep 30 mm): down from the trackpad's
      # vertical connector through the slot (y -17.4), 90 deg bend, then flat
      # under the PCB ~11.9 mm north into this connector (no folds, no twist).
      # Straight cable, so trackpad pin n lands on Molex pin n:
      #   1 SCK 2 MISO 3 SS 4 DR 5 MOSI 6 BTN2 7 BTN3 8 BTN1
      #   9 SCL 10 SDA 11 GND 12 VDD(3.3 V)
      # Cable type: the face touching the contacts here (towards the PCB) is the
      # face pointing at the trackpad centre at the other end -> "same side"
      # FFC if the trackpad connector's contacts are on its inner wall,
      # "opposite side" if on the outer wall (checked: outer wall -> opposite-
      # side / Type D cable, 12 pin 0.5 mm, 30 mm). Pin 1 checked on the real part
      # (photo, back side): trackpad J1 pin 1 is at the east end (+x), and so is
      # Molex pin 1 here; the straight cable keeps the order -> pin n = pin n.
      trackpad_conn:
        what: molex_505278
        where:
          aggregate.parts:
            - hand-zone_c9_r2
            - mirror_hand-zone_c9_r2
          rotate: 0
          shift: [0, 5.5]    # 30 mm FFC: connector bottom z 10.1 -> drop 1.6 mm to the PCB bottom, flat run ~19.3 mm
        params:
          side: B
          P1: TP_SCK           # trackpad 1 (SPI only)
          P2: TP_MISO          # trackpad 2 (SPI only)
          P3: TP_SS            # trackpad 3 (SPI only)
          P4: CIRQUE_DR        # trackpad 4 DR -> GP12
          P5: TP_MOSI          # trackpad 5 (SPI only)
          P6: TP_BTN2          # trackpad 6 (unused)
          P7: TP_BTN3          # trackpad 7 (unused)
          P8: TP_BTN1          # trackpad 8 (unused)
          P9: SCL              # trackpad 9 SCL
          P10: SDA             # trackpad 10 SDA
          P11: GND             # trackpad 11 GND
          P12: 3V3             # trackpad 12 VDD
          MP: GND

      # Cirque TM040040 trackpad: 3D model only (it is cabled, not soldered).
      # It lies on the switch plate (5 mm pad, underside z 12.6, top z 17.6 in the
      # case), held by the trackpad_ring; the connector reaches down to the PCB top.
      trackpad_model:
        what: mech_model
        where:
          aggregate.parts:
            - hand-zone_c9_r2
            - mirror_hand-zone_c9_r2
          rotate: 0
          shift: [0, -2]
        params:
          label: TM040040
          model: ${KIPRJMOD}/../../kicad-libraries/3dmodels/Cirque_TM040040.step
          model_offset: [0, 0, 4.925]   # pad top z 17.6 = PCB top + 7.5 (5 mm pad on the plate; model origin mid-height)

