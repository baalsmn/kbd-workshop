# keyboard: hachigo74   (output folder for case/, renders/, kle/; read by tools/lib/design.sh)
# hachigo74: 74 keys (37 per half), from hachigo74/kle/hachigo74.json. Based on
# kugo82.yaml with column c1 removed (column names c2..c9 kept); c2-c4 adjusted
# to the layout. LED chain: 2 indicators + 74 key LEDs = 76.
units:
  sp: 19
  kc: 18.2
  sw: 14.06   # plate cutout; 14.1 printed too big, 14.06 fits (test strip, hachigo74/case/test/)



points:
  # horizontal spacing between centerpoints:
  key.spread: sp 
  key.height: kc
  key.width: kc
  # vertical spacing between centerpoints:
  key.padding: sp #
  key.stagger: 0
  key.splay: 0
  # keycap width in U and stabilizer flag, read by the ks33_hotswap footprint
  key.keycap_u: 1
  key.stab: false
  zones:
    hand-zone:
      # Moves the whole keyboard (both halves) on the KiCad sheet.
      # x: right, y: negative = down on the KiCad sheet. Tune after the first run.
      anchor:
        shift: [50, -100]
      rotate: -15
      columns:
        c2:
          key.column_net: C2   # shared by the left and the mirrored key
          rows.r5.skip: true
          # hachigo74: c1 removed, c2 is the outer column now (names kept, so
          # every reference stays valid; the board just moves 1 sp on the sheet).
          # KLE: all 1U at 1.5 (c2 origin 1.0 -> r1 shift carries to r2..r4)
          rows.r1.shift: [0.5sp, 0]
          rows.r1.led_l_in: LED_7
          rows.r1.led_l_out: LED_8
          rows.r1.led_r_in: LED_72
          rows.r1.led_r_out: LED_73
          rows.r2.led_l_in: LED_6
          rows.r2.led_l_out: LED_7
          rows.r2.led_r_in: LED_73
          rows.r2.led_r_out: LED_74
          rows.r3.led_l_in: LED_5
          rows.r3.led_l_out: LED_6
          rows.r3.led_r_in: LED_74
          rows.r3.led_r_out: LED_75
          rows.r4.led_l_in: LED_DATA   # hachigo74: first key LED (c1 removed)
          rows.r4.led_l_out: LED_5
          rows.r4.led_r_in: LED_75
          rows.r4.led_r_out: LED_END   # last key LED (c1 removed)
        c3:
          key.column_net: C3   # shared by the left and the mirrored key
          key.spread: 1.25sp
          # hachigo74 KLE: r1-r4 1U at 2.5; shifts carry over. r5 (Esc) is 1U now (was
          # 1.25U at 2.375), in line with the column
          rows.r1.shift: [0.25sp,0]
          rows.r1.led_l_in: LED_8
          rows.r1.led_l_out: LED_9
          rows.r1.led_r_in: LED_71
          rows.r1.led_r_out: LED_72
          rows.r2.led_l_in: LED_9
          rows.r2.led_l_out: LED_10
          rows.r2.led_r_in: LED_70
          rows.r2.led_r_out: LED_71
          rows.r3.led_l_in: LED_10
          rows.r3.led_l_out: LED_11
          rows.r3.led_r_in: LED_69
          rows.r3.led_r_out: LED_70
          rows.r4.led_l_in: LED_11
          rows.r4.led_l_out: LED_12
          rows.r4.led_r_in: LED_68
          rows.r4.led_r_out: LED_69
          rows.r5.led_l_in: LED_12
          rows.r5.led_l_out: LED_13
          rows.r5.led_r_in: LED_67
          rows.r5.led_r_out: LED_68
        c4:
          key.column_net: C4   # shared by the left and the mirrored key
          # KLE: column 1.25U from c3 (moves c4..c9 0.25U towards the centre),
          # hachigo74: all 1U at 3.5 (r1 = Right arrow)
          key.spread: 1.25sp
          rows.r1.led_l_in: LED_17
          rows.r1.led_l_out: LED_18
          rows.r1.led_r_in: LED_62
          rows.r1.led_r_out: LED_63
          rows.r2.led_l_in: LED_16
          rows.r2.led_l_out: LED_17
          rows.r2.led_r_in: LED_63
          rows.r2.led_r_out: LED_64
          rows.r3.led_l_in: LED_15
          rows.r3.led_l_out: LED_16
          rows.r3.led_r_in: LED_64
          rows.r3.led_r_out: LED_65
          rows.r4.led_l_in: LED_14
          rows.r4.led_l_out: LED_15
          rows.r4.led_r_in: LED_65
          rows.r4.led_r_out: LED_66
          rows.r5.led_l_in: LED_13
          rows.r5.led_l_out: LED_14
          rows.r5.led_r_in: LED_66
          rows.r5.led_r_out: LED_67
        c5:
          rows.r1.keycap_u: 2   # 2U bottom-row key with KS-57 stabilizer
          rows.r1.stab: true
          key.column_net: C5   # shared by the left and the mirrored key
          key.stagger: 0.25sp
          rows.r1.shift: [0.5sp,0]
          rows.r2.shift: [-0.5sp,0]
          rows.r1.led_l_in: LED_18
          rows.r1.led_l_out: LED_19
          rows.r1.led_r_in: LED_61
          rows.r1.led_r_out: LED_62
          rows.r2.led_l_in: LED_19
          rows.r2.led_l_out: LED_20
          rows.r2.led_r_in: LED_60
          rows.r2.led_r_out: LED_61
          rows.r3.led_l_in: LED_20
          rows.r3.led_l_out: LED_21
          rows.r3.led_r_in: LED_59
          rows.r3.led_r_out: LED_60
          rows.r4.led_l_in: LED_21
          rows.r4.led_l_out: LED_22
          rows.r4.led_r_in: LED_58
          rows.r4.led_r_out: LED_59
          rows.r5.led_l_in: LED_22
          rows.r5.led_l_out: LED_23
          rows.r5.led_r_in: LED_57
          rows.r5.led_r_out: LED_58
        c6:
          key.column_net: C6   # shared by the left and the mirrored key
          rows.r1.skip: true
          rows.r2.shift: [0,0]
          rows.r2.led_l_in: LED_26
          rows.r2.led_l_out: LED_27
          rows.r2.led_r_in: LED_53
          rows.r2.led_r_out: LED_54
          rows.r3.led_l_in: LED_25
          rows.r3.led_l_out: LED_26
          rows.r3.led_r_in: LED_54
          rows.r3.led_r_out: LED_55
          rows.r4.led_l_in: LED_24
          rows.r4.led_l_out: LED_25
          rows.r4.led_r_in: LED_55
          rows.r4.led_r_out: LED_56
          rows.r5.led_l_in: LED_23
          rows.r5.led_l_out: LED_24
          rows.r5.led_r_in: LED_56
          rows.r5.led_r_out: LED_57
        c7:
          # no stagger: level with c6 (c8 takes the -0.25sp, so c8 / c9 stay put)
          # r1: 1.25U (was 2U + KS-57) between c5_r1 and the c9_r1 thumb key: its
          # keycap bottom edge lies on the line from the c5_r1 keycap's bottom-right
          # corner to the c9_r1 keycap's bottom-left corner (27.29 mm at -25.6 deg),
          # centred on it: 2.17 mm keycap gap to both neighbours.
          # adjust from the r1 base position (no carry-over to r2..r5):
          rows.r1.keycap_u: 1.25
          rows.r1.adjust:
            shift: [6.335, -6.787]
            rotate: -25.597
          key.column_net: C7   # shared by the left and the mirrored key
          key.stagger: 0
          rows.r1.led_l_in: LED_27
          rows.r1.led_l_out: LED_28
          rows.r1.led_r_in: LED_52
          rows.r1.led_r_out: LED_53
          rows.r2.led_l_in: LED_28
          rows.r2.led_l_out: LED_29
          rows.r2.led_r_in: LED_51
          rows.r2.led_r_out: LED_52
          rows.r3.led_l_in: LED_29
          rows.r3.led_l_out: LED_30
          rows.r3.led_r_in: LED_50
          rows.r3.led_r_out: LED_51
          rows.r4.led_l_in: LED_30
          rows.r4.led_l_out: LED_31
          rows.r4.led_r_in: LED_49
          rows.r4.led_r_out: LED_50
          rows.r5.led_l_in: LED_31
          rows.r5.led_l_out: LED_32
          rows.r5.led_r_in: LED_48
          rows.r5.led_r_out: LED_49
        c8:
          key.column_net: C8   # shared by the left and the mirrored key
          key.stagger: -0.25sp   # was on c7: keeps c8 / c9 where they were
          rows.r1.skip: true
          rows.r2.led_l_in: LED_35
          rows.r2.led_l_out: LED_36
          rows.r2.led_r_in: LED_44
          rows.r2.led_r_out: LED_45
          rows.r3.led_l_in: LED_34
          rows.r3.led_l_out: LED_35
          rows.r3.led_r_in: LED_45
          rows.r3.led_r_out: LED_46
          rows.r4.led_l_in: LED_33
          rows.r4.led_l_out: LED_34
          rows.r4.led_r_in: LED_46
          rows.r4.led_r_out: LED_47
          rows.r5.led_l_in: LED_32
          rows.r5.led_l_out: LED_33
          rows.r5.led_r_in: LED_47
          rows.r5.led_r_out: LED_48
        c9:
          key.column_net: C9   # shared by the left and the mirrored key
          key.stagger: -0.25sp   # KLE
          # kugo82: new 1U r5 key (F11 / F12)
          # KLE: r1 (Layer) 1.25U, extended towards the centre; r2 shifts back
          rows.r1.shift: [0.125sp, 0]
          rows.r1.keycap_u: 1.25
          rows.r2.shift: [-0.125sp, 0]
          # thumb key: c9_r1 moved to the "thumb-zone one" key of the old interstate
          # design (ergogen-26-10-07.yaml), placed relative to c9_r2: centre at
          # [-8.805, -28.245] mm in the c9_r2 frame, turned a further -30 deg.
          # adjust moves only this key (no carry-over to r2..r5); from the r1
          # position above ([0.125sp, -sp] in the c9_r2 frame) that is:
          rows.r1.adjust:
            shift: [-11.18, -9.245]
            rotate: -30
          rows.r1.led_l_in: LED_36
          rows.r1.led_l_out: LED_37
          rows.r1.led_r_in: LED_43
          rows.r1.led_r_out: LED_44
          rows.r2.led_l_in: LED_37
          rows.r2.led_l_out: LED_38
          rows.r2.led_r_in: LED_42
          rows.r2.led_r_out: LED_43
          rows.r3.led_l_in: LED_38
          rows.r3.led_l_out: LED_39
          rows.r3.led_r_in: LED_41
          rows.r3.led_r_out: LED_42
          rows.r4.led_l_in: LED_39
          rows.r4.led_l_out: LED_40
          rows.r4.led_r_in: LED_40b
          rows.r4.led_r_out: LED_41
          rows.r5.led_l_in: LED_40
          rows.r5.led_l_out: LED_40a
          rows.r5.led_r_in: LED_40a
          rows.r5.led_r_out: LED_40b
      rows:
        r1:
          row_net: R1        # left half
          row_net_r: R6      # right half
        r2:
          row_net: R2        # left half
          row_net_r: R7      # right half
        r3:
          row_net: R3        # left half
          row_net_r: R8      # right half
        r4:
          row_net: R4        # left half
          row_net_r: R9      # right half
        r5:
          row_net: R5        # left half
          row_net_r: R10      # right half

  mirror: &mirror
    ref: hand-zone_c9_r3
    shift: [.5sp, .5sp]
    distance: sp+40

outlines:


  switches_outline:
    - what: rectangle
      where: true
      size: [sw,sw]
  # Gateron KS-57 low-profile plate-mounted 2U stabilizer, plate cutout as
  # recommended in the KS-57B210T spec (stabs 24 mm apart, 6.0 x 12.5 each,
  # 1.7 mm lever notch, 2.5 mm channels into the switch cutout).
  # Notch side = south (towards the user), as drawn in the spec.
  stab_cutouts:
    - what: rectangle
      where: /_c5_r1$/
      size: [6, 12.5]
      adjust.shift: [-12, -0.6]
    - what: rectangle
      where: /_c5_r1$/
      size: [6, 12.5]
      adjust.shift: [12, -0.6]
    - what: rectangle
      where: /_c5_r1$/
      size: [1.7, 1.4]
      adjust.shift: [-12, -7.35]
    - what: rectangle
      where: /_c5_r1$/
      size: [1.7, 1.4]
      adjust.shift: [12, -7.35]
    - what: rectangle
      where: /_c5_r1$/
      size: [2.2, 2.5]
      adjust.shift: [-8.0, -1.4]
    - what: rectangle
      where: /_c5_r1$/
      size: [2.2, 2.5]
      adjust.shift: [8.0, -1.4]
  # 0.96" SSD1306 module, rotated 180 deg (header at the bottom, y 33.3,
  # just below the Helios), soldered on bare header pins ~1.2 mm above the
  # PCB (no plastic spacer), so it sits inside this plate cutout.
  # Window = display area (in the centre cover).
  oled:
    - what: rectangle
      size: [28.2, 28]
      corner: 1
      where:
        aggregate.parts: 
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        shift: [0, 35.7]    # kugo82: 9.8 mm south, cutout bottom 21.7 (1.5 above the trackpad ring)
  # The lid plate's own opening (user 2026-11-05): 0.5 further north than the cover's pocket, square corners
  oled_plate:
    - what: rectangle
      size: [28.2, 28.5]
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        shift: [0, 35.95]
  # visible screen (user 2026-11-07, on the built keyboard: the LCD is 15 high and the old 23 x 12 window at 36.35
  # sat 1 north of it, covering its south edge): 23 x 15, north edge 1.2 further south (41.15), south edge 26.15;
  # 23 x 14 since 2026-11-07 (user: smaller, north edge kept at 41.15, south edge 27.15); Fusion chamfers its top
  # edge 1 across x 0.5 down (window_chamfer_h / window_chamfer_v); 24 wide since 2026-11-07 (user: 0.5 more each side)
  oled_window:
    - what: rectangle
      size: [24, 14]
      corner: 1
      where:
        aggregate.parts: 
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        shift: [0, 34.15]
  # T clip holding the cover's north edge to the plates (user 2026-11-07): a separate printed T in the
  # middle of the north wall; its stem goes down through the joint between the lid plates (a half notch
  # in each plate), its bar runs east-west under both plates (z 10.45-11.25, 0.15 under the plate, 0.35
  # over the PCB, between the Helios pin rows: 1.2 from the pads' edges). The lids slide in sideways under
  # it; the stem is glued into a socket in the cover's underside. Prints lying on its south face. Fusion adds a lead-in
  # chamfer on the bar's top edges at the east / west ends (clip_chamfer_h 1.5 / clip_chamfer_v 0.5).
  cover_clip_bar:
    - what: rectangle
      size: [11, 4.65]
      where:
        aggregate.parts: 
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        shift: [0, 52.326]
  cover_clip_stem:
    - what: rectangle
      size: [3.0, 1.6]
      where:
        aggregate.parts: 
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        shift: [0, 50.801]
  # socket for the stem in the cover underside (0.1 play), z 12.6-14.1
  cover_clip_socket:
    - what: rectangle
      size: [3.2, 2.2]
      where:
        aggregate.parts: 
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        shift: [0, 50.601]
  # notch for the stem in the plates (0.2 play), 0.3 inside the cover edge
  lid_clip_notch:
    - what: rectangle
      size: [3.4, 1.8]
      where:
        aggregate.parts: 
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        shift: [0, 50.901]
  # 2 indicator LEDs where they were next to the c9_r1 keys before c9_r1 became the
  # thumb key (anchored on c9_r2 now), on their inner side (19.5 mm
  # from the old key centre = 8 mm past the 1.25U keycap edge at 11.5): 3 mm light holes in
  # the plate. left = layout layer colour, right = function/layer lock (green).
  indicator_holes:
    - what: circle
      radius: 1.5
      where:
        ref: hand-zone_c9_r2
        shift: [0.125sp + 19.5, -sp]   # = the old c9_r1 [19.5, 0]
    - what: circle
      radius: 1.5
      where:
        ref: mirror_hand-zone_c9_r2
        shift: [0.125sp + 19.5, -sp]   # = the old c9_r1 [19.5, 0]
  # Trackpad mounting (user 2026-11-05): the TM040040 with Cirque's curved ABS overlay
  # (datasheet p. 13, section A-A: top face 43.86, a flange round the bottom out to 46.13, about
  # 1 wide (1.135 by the drawing) and 1.7 thick (user measured); the 40 mm board in its R20.20
  # pocket; 5 mm thick without the connector, user measured) sits in a 1 mm recess in the
  # centre cover top: it rests on the overlay's underside on the cover's low layer (z 14.5, ledge
  # r 20.4 - 23.25), top z 19.5 (0.5 below the keycap tops). The cover is open below r 20.4
  # (board + parts), the plate below r 18.1. Held by a screw-on ring (trackpad_ring): M50x1.5,
  # male thread on a collar of the cover (r 23.25 - 25, z 15.5-18.3), the ring's internal thread
  # and a sleeve under its lip (r 22.2 - 23.1, inside the collar's bore) press the flange down
  # (flange top z 16.2); the lip (z 19.5-20.3) stays outside the 43.86 top face.
  # The threads are modeled in Fusion only (KeyboardCase THREADS, play `thread_play`); the STL /
  # STEP of the cover and ring are plain placeholders. Anti-rotation: a pin in the overlay's notch (tp_notch_pin).
  # The pad's north edge is 0.6 from the OLED pocket in plan, the ring 6 from the screen window.
  # recess for the pad in the cover's top layer (z 14.5-15.5): overlay r 23.065 + 0.185
  cirque_flush:
    - what: circle
      radius: 23.25
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [0,-2]
  # opening through the cover's low layer under the pad (board r 20.2 in the overlay + 0.2)
  tp_cover_opening:
    - what: circle
      radius: 20.4
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [0, -2]
  # anti-rotation pin (user 2026-11-05) in the overlay's test alignment notch, turned to the south: the notch is
  # 2.3 wide, as tall as the flange (1.7) and cuts 2.5 in from the edge (r 20.565 - 23.065). Pin 2.0 wide on the
  # ledge, from r 20.7 out into the recess wall / collar (r 23.4), 1.5 tall (z 14.5-16.0: 0.2 under the flange
  # top, so the ring's sleeve lands on the flange, not the pin).
  tp_notch_pin:
    - what: rectangle
      size: [2, 2.7]
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [0, -24.05]   # y -22.7 .. -25.4 = r 20.7 .. 23.4 from the pad centre (0, -2)
  # The connector sticks out 2.5 mm below the pad (user measured), now down to z 12.0 in the
  # plate opening; the PCB cutout (tp_cable_slot, 12 x 5) lets the FFC through to the Molex
  # (30 mm FFC, user checked it still reaches with the pad 1.9 higher).
  # PCB cutout under the trackpad connector: the connector sticks out 2.5 mm
  # below the pad (user measured), i.e. down to the PCB top exactly, so the
  # cutout takes the whole connector body comfortably (12-pin 0.5 mm vertical,
  # ~10 x 3 mm) and the FFC goes straight down, then bends into the Molex
  tp_cable_slot:
    - what: rectangle
      size: [12, 5]
      corner: 1
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [0.000, -17.400]
  # plate opening under the pad's parts zone (pad rests on its rim around it)
  tp_plate_opening:
    - what: circle
      radius: 18.1
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [0, -2]
  tp_outline:        # the pad itself: Cirque's curved overlay, 46.13 round (datasheet p. 13), no flats
    - what: circle
      radius: 23.065
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [0, -2]
  # Support under the pad's rim (user 2026-11-05: the pad must not wobble when pushed): a ring from the
  # plate's underside to the PCB top (z 10.1-11.4, part of the lids), r 18.2-20 (0.1 off the plate opening,
  # outside the pad's parts zone, up to the pad's edge). Cut 0.3-0.5 round the FFC slot (not tangent to r 18.2).
  tp_support:
    - what: circle
      radius: 20
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [0, -2]
    - operation: subtract
      what: circle
      radius: 18.2
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [0, -2]
    - operation: subtract
      what: rectangle
      size: [12.6, 6]
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [0, -17.4]
  # Screw-on trackpad ring (M50x1.5; thread geometry and play in Fusion, see cirque_flush):
  #   collar on the cover, r 23.25 - 25.0 (thread major), z 15.5-18.7, on a seat r 26.5, z 15.5-16.2
  #   (thread 16.2-18.7, all of it engaged with the ring)
  #   ring, r 24.188 (internal thread minor) - 26.5, z 16.2-18.9 (thread), solid r 22.2 - 26.5, z 18.9-20.3,
  #   sleeve r 22.2 - 23.1, z 16.2-19.5 (0.135 off the pad's side, 0.15 off the collar's bore)
  tp_collar:
    - what: circle
      radius: 25
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [0, -2]
    - operation: subtract
      name: cirque_flush
  # seat under the ring (user 2026-11-06): the cover top raised 0.7 (z 15.5-16.2) out to the ring's r 26.5,
  # level with the flange top, so the ring's bottom and its sleeve's end land at the same height (16.2)
  tp_ring_seat:
    - what: circle
      radius: 26.5
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [0, -2]
    - operation: subtract
      name: cirque_flush
  tp_ring_body:
    - what: circle
      radius: 26.5
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [0, -2]
    - what: circle
      radius: 24.188
      operation: subtract
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [0, -2]
  # sleeve from the lip down inside the collar's bore onto the overlay's bottom flange (user measured
  # 1.7 thick -> flange top z 16.2; width 1 assumed, datasheet ~1.135: pad side r 22.065 above it)
  tp_ring_sleeve:
    - what: circle
      radius: 23.1
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [0, -2]
    - what: circle
      radius: 22.2
      operation: subtract
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [0, -2]
  tp_ring_lip:
    - what: circle
      radius: 26.5
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [0, -2]
    - what: circle
      radius: 22.2
      operation: subtract
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [0, -2]
  # Centre cover outline (from the user's draft): a strip parallel to the
  # OLED, 33 mm wide (OLED pocket +-14.1 + 2.4 mm wall),
  # widening into a circle r 29.3 around the trackpad (concentric,
  # 2.8 mm outside the screw-on ring), top and bottom edges straight: top 2.4 mm
  # above the OLED cutout, bottom 2.4 mm past the south screws; corners r 3.
  center_cover_raw:
    - what: rectangle
      size: [33, 85.2]
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [0, 9.5]      # y -33.1 .. 52.1: 2.4 mm past the south screw holes (-29.5, r 1.2) and above the OLED cutout top (49.7), same 2.4 mm as at the sides
    - what: circle
      radius: 29.3
      operation: add
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [0, -2]
  cirque_cover:
    - name: center_cover_raw
      fillet: 3
  # Key-area screws (kugo82, user's choice): one at c2_r2 and one at c5_r3 per
  # half, at switch corner crossings. Everything else under the keys was removed
  # (screws and studs): the case-wall screws hold the lid and tub together.
  # Clearance (5.5 mm insert post): room on the back >= 3.55 mm, switch bodies
  # >= 2.5 mm, cutouts >= 6.7 mm, on both halves.
  c9r5_screw:
    - what: circle
      radius: 1.2
      where:
        ref: hand-zone_c2_r2
        shift: [9.5, 9.0]   # c2/c3 at r2/r3 (NE corner; hachigo74: moved from [10.5, 8.5], c2/c3 keys shifted)
    - what: circle
      radius: 1.2
      where:
        ref: mirror_hand-zone_c2_r2
        shift: [9.5, 9.0]   # c2/c3 at r2/r3 (NE corner; hachigo74: moved from [10.5, 8.5], c2/c3 keys shifted)
    - what: circle
      radius: 1.2
      where:
        ref: hand-zone_c5_r3
        shift: [9.0, -10.5]   # c5/c6 at r2/r3 (SE corner; the west corners have only 1.1 mm room)
    - what: circle
      radius: 1.2
      where:
        ref: mirror_hand-zone_c5_r3
        shift: [9.0, -10.5]   # c5/c6 at r2/r3 (SE corner; the west corners have only 1.1 mm room)
  # Screws through the OLED module's 2 bottom corner holes (module footprint
  # (+-11.8, 0.635) from the header row, measured on the module: 23.6 apart, rotated 180 deg). Below the PCB a
  # 5.5 mm insert post (insert_post), above it a 1.1 mm spacer up to the module
  # underside (separate printed part oled_spacers). They also hold the centre
  # cover (holes through every layer, like pcb_mounting).
  oled_screw:
    - what: circle
      radius: 1.2
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [11.8, 24.135]
    - what: circle
      radius: 1.2
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [-11.8, 24.135]
  pcb_mounting_std: # standard mounting holes (7.4 mm posts): only the cover screws south of the trackpad
    # key-area screws moved to the thin-post group (c9r5_screw), kugo82
    # centre cover screws, south of the trackpad
    # (the 2 north ones go through the OLED holes, see oled_screw)
    - what: circle
      radius: 1.2
      where:
        aggregate.parts: 
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [-11, -29.5]
    - what: circle
      radius: 1.2
      where:
        aggregate.parts: 
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [11, -29.5]
  pcb_mounting: # all mounting holes, cut through every part
    - name: pcb_mounting_std
    - operation: add
      name: c9r5_screw
    - operation: add
      name: oled_screw

  edge_mounting: # mounting holes case elements only
    # left bottom
    - what: circle
      radius: 1.2
      where:
        - ref: hand-zone_c2_r1
          shift: [-0.5kc-5.5, -0.5kc-5.5]   # 3.5 mm diagonally off the PCB corner (keycap corner + 2)
    - what: circle
      radius: 1.2
      where:
        - ref: mirror_hand-zone_c2_r1
          shift: [-0.5kc-5.5, -0.5kc-5.5]   # 3.5 mm diagonally off the PCB corner (keycap corner + 2)
    # left top corner
    - what: circle
      radius: 1.2
      where:
        - ref: hand-zone_c2_r4
          shift: [-(0.5kc+5), (0.5kc + 5)]   # off the keycap corner (PCB corner - 2)
    - what: circle
      radius: 1.2
      where:
        - ref: mirror_hand-zone_c2_r4
          shift: [-(0.5kc+5), (0.5kc + 5)]   # off the keycap corner (PCB corner - 2)
    # top left second corner
    - what: circle
      radius: 1.2
      where:
        - ref: hand-zone_c3_r5
          shift: [-(0.5kc+4), (0.5kc + 5)]   # follows the c3_r5 (Esc) corner of the outline
    - what: circle
      radius: 1.2
      where:
        - ref: mirror_hand-zone_c3_r5
          shift: [-(0.5kc+4), (0.5kc + 5)]
    #  center hole
    - what: circle
      radius: 1.2
      where:
        - ref: hand-zone_c5_r5
          shift: [0.5sp, (0.5kc + 6)]   # 4 mm off the PCB edge, centred in the 8 mm wall
    - what: circle
      radius: 1.2
      where:
        - ref: mirror_hand-zone_c5_r5
          shift: [0.5sp, (0.5kc + 6)]   # 4 mm off the PCB edge, centred in the 8 mm wall
    # bottom center hole
    - what: circle
      radius: 1.2
      where:
        - ref: hand-zone_c4_r1
          shift: [28.5, -(0.5kc + 6)]   # under c5_r1's centre, 4 mm off the straight bottom edge: centred in the 8 mm wall
    - what: circle
      radius: 1.2
      where:
        - ref: mirror_hand-zone_c4_r1
          shift: [28.5, -(0.5kc + 6)]   # under c5_r1's centre, 4 mm off the straight bottom edge: centred in the 8 mm wall
    # top right C9 corner
    - what: circle
      radius: 1.2
      where:
        - ref: hand-zone_c8_r5
          shift: [(0.5sp), (0.5sp + 6)]   # 4 mm off the PCB edge
    - what: circle
      radius: 1.2
      where:
        - ref: mirror_hand-zone_c8_r5
          shift: [(0.5sp), (0.5sp + 6)]   # 4 mm off the PCB edge

    #   center two dots
#    - what: circle
#      radius: 1.2
#      where:
#        aggregate.parts: 
#          - hand-zone_c8_r5
#          - mirror_hand-zone_c8_r5
#        shift: [-10, 12.5]
#    - what: circle
#      radius: 1.2
#      where:
#        aggregate.parts: 
#          - hand-zone_c8_r5
#          - mirror_hand-zone_c8_r5
#        shift: [10, 12.5]
    - what: circle
      radius: 1.2
      where:
        - ref: hand-zone_c9_r1
          shift: [0, -(0.5kc + 6)]   # centred 4 mm below the thumb key's PCB edge
    - what: circle
      radius: 1.2
      where:
        - ref: mirror_hand-zone_c9_r1
          shift: [0, -(0.5kc + 6)]   # centred 4 mm below the thumb key's PCB edge
  # PCB outline before its 2 mm rounding: the case is grown from this one so
  # its outer corners can be sharp-then-filleted (r 3) instead of r 10 / r 12
  pcb_core:   # keycap corners; pcb_outline (+2 mm) is then 2 mm from every keycap
    - what: polygon
      operation: stack
      points:
        # left half, from the bottom-left keycap corner of c2_r1, clockwise
        - ref: hand-zone_c2_r1
          shift: [-0.5kc, -0.5kc]   # outer column c2: straight left edge
        - ref: hand-zone_c2_r4
          shift: [-0.5kc, 0.5kc]
        - ref: hand-zone_c3_r5
          shift: [-0.5kc, -0.5kc]   # under c3_r5 (c2_r4 top-right is under it)
        - ref: hand-zone_c3_r5
          shift: [-0.5kc, 0.5kc]   # c3_r5 (Esc, 1U)
        - ref: hand-zone_c3_r5
          shift: [0.5kc, 0.5kc]
        - ref: hand-zone_c4_r5
          shift: [-0.5kc, 0.5kc]
        - ref: hand-zone_c4_r5
          shift: [0.5kc, 0.5kc]
        - ref: hand-zone_c5_r5
          shift: [-0.5kc, 0.5kc]
        - ref: hand-zone_c5_r5
          shift: [0.5kc, 0.5kc]
        - ref: hand-zone_c6_r5
          shift: [-0.5kc, 0.5kc]
        - ref: hand-zone_c6_r5
          shift: [0.5kc, 0.5kc]
        - ref: hand-zone_c7_r5
          shift: [-0.5kc, 0.5kc]
        - ref: hand-zone_c7_r5
          shift: [0.5kc, 0.5kc]
        - ref: hand-zone_c8_r5
          shift: [-0.5kc, 0.5kc]
        - ref: hand-zone_c8_r5
          shift: [0.5sp, 0.5sp]   # top bridge as before (MCU / USB-C stay put)
        # over to the mirrored half on top, then down it (reverse order)
        - ref: mirror_hand-zone_c8_r5
          shift: [0.5sp, 0.5sp]
        - ref: mirror_hand-zone_c8_r5
          shift: [-0.5kc, 0.5kc]
        - ref: mirror_hand-zone_c7_r5
          shift: [0.5kc, 0.5kc]
        - ref: mirror_hand-zone_c7_r5
          shift: [-0.5kc, 0.5kc]
        - ref: mirror_hand-zone_c6_r5
          shift: [0.5kc, 0.5kc]
        - ref: mirror_hand-zone_c6_r5
          shift: [-0.5kc, 0.5kc]
        - ref: mirror_hand-zone_c5_r5
          shift: [0.5kc, 0.5kc]
        - ref: mirror_hand-zone_c5_r5
          shift: [-0.5kc, 0.5kc]
        - ref: mirror_hand-zone_c4_r5
          shift: [0.5kc, 0.5kc]
        - ref: mirror_hand-zone_c4_r5
          shift: [-0.5kc, 0.5kc]
        - ref: mirror_hand-zone_c3_r5
          shift: [0.5kc, 0.5kc]
        - ref: mirror_hand-zone_c3_r5
          shift: [-0.5kc, 0.5kc]
        - ref: mirror_hand-zone_c3_r5
          shift: [-0.5kc, -0.5kc]
        - ref: mirror_hand-zone_c2_r4
          shift: [-0.5kc, 0.5kc]
        - ref: mirror_hand-zone_c2_r1
          shift: [-0.5kc, -0.5kc]
        - ref: mirror_hand-zone_c2_r1
          shift: [0.5kc, -0.5kc]
        - ref: mirror_hand-zone_c3_r1
          shift: [-0.5kc, -0.5kc]
        - ref: mirror_hand-zone_c3_r1
          shift: [0.5kc, -0.5kc]
        - ref: mirror_hand-zone_c4_r1
          shift: [-0.5kc, -0.5kc]
        - ref: mirror_hand-zone_c4_r1
          shift: [0.5kc, -0.5kc]
        - ref: mirror_hand-zone_c4_r1
          shift: [57.016, -0.5kc]   # straight c2-c4 bottom line on to c7_r1 (see the left half)
        - ref: mirror_hand-zone_c7_r1
          shift: [(0.125sp + 0.5kc), -0.5kc]
        - ref: mirror_hand-zone_c9_r1
          shift: [-(0.125sp + 0.5kc), -0.5kc]
        - ref: mirror_hand-zone_c9_r1
          shift: [(0.125sp + 0.5kc), -0.5kc]
        - ref: mirror_hand-zone_c9_r1
          shift: [(0.125sp + 0.5kc), 0]
        # bottom bridge back to the left half (middle of the thumb key inner edges)
        - ref: hand-zone_c9_r1
          shift: [(0.125sp + 0.5kc), 0]   # middle of the thumb key inner edge: bottom bridge
        - ref: hand-zone_c9_r1
          shift: [(0.125sp + 0.5kc), -0.5kc]   # thumb key
        - ref: hand-zone_c9_r1
          shift: [-(0.125sp + 0.5kc), -0.5kc]   # c9_r1 / c7_r1 / c5_r1 bottom corners lie on one line
        - ref: hand-zone_c7_r1
          shift: [(0.125sp + 0.5kc), -0.5kc]
        # the c2-c4 keycap bottom line, straight on to where it meets the c7_r1 keycap's
        # bottom edge (38 % along it): no step under the 2U c5_r1, more room for routing.
        # 57.016 = that intersection in c4_r1's frame (from the built points; re-derive it
        # if c4 / c5 / c7 r1 move)
        - ref: hand-zone_c4_r1
          shift: [57.016, -0.5kc]
        - ref: hand-zone_c4_r1
          shift: [0.5kc, -0.5kc]
        - ref: hand-zone_c4_r1
          shift: [-0.5kc, -0.5kc]
        - ref: hand-zone_c3_r1
          shift: [0.5kc, -0.5kc]
        - ref: hand-zone_c3_r1
          shift: [-0.5kc, -0.5kc]
        - ref: hand-zone_c2_r1
          shift: [0.5kc, -0.5kc]

  pcb_outline: # pcb board outline
    - name: pcb_core
      expand: 2
  tub_cavity:  # inside of the tub wall: the PCB + 0.25 clearance per side (board tolerance, print)
    - name: pcb_core
      expand: 2.25

  # case outline: 8 mm wall around the PCB (pcb_core + 2 + 8), pointed joints,
  # then every corner rounded r 3
  case:
    - what: outline
      name: pcb_core
      expand: 10
      joints: pointy
      fillet: 3
  

  # Hole in the case floor right under the Helios reset button (SW1, Panasonic
  # EVP-AF on the Helios component side, which faces down: the Helios sits
  # upside down on the back). Helios board: SW1 at (+4.885, +11.715) from the
  # board centre (y down); mirrored on the back -> x -4.885; board centre is
  # 1.115 north of the footprint origin (0, 54.7) -> (-4.885, 44.10).
  # Press it with a pin/paperclip from below (hold ~1 s = UF2 bootloader).
  # Pin channel: 1.3 mm bore (prints ~1.1-1.2, takes a 0.8-1 mm SIM tool or
  # paperclip) through the 3 mm floor and a 1.8 mm boss on top of it, so the
  # pin is guided 4.8 mm straight up at the button (boss top z 4.8, ~2 mm
  # under the Helios' component side at z 6.9).
  mcu_reset_hole:
    - what: circle
      radius: 0.65
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [-4.885, 44.10]

  mcu_reset_disc:
    - what: circle
      radius: 1.6
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [-4.885, 44.10]
  mcu_reset_boss:
    - name: mcu_reset_disc
    - operation: subtract
      name: mcu_reset_hole

  case_bottom:  # base plate w mounting cutouts
    - name: case
    - operation: subtract
      name: pcb_mounting
    - operation: subtract
      name: edge_mounting
    - operation: subtract
      name: mcu_reset_hole

  # Centre cover (follows cirque_cover):
  #   low layer: plate top -> OLED glass top, pocket for the OLED module, opening under the pad
  #   top layer: OLED glass top -> z 15.5, with the screen window and the pad recess
  center_cover_low:
    - name: cirque_cover
    - operation: subtract
      name: tp_cover_opening
    - operation: subtract
      name: oled
    - operation: subtract
      name: indicator_holes
  center_cover_top:
    - name: cirque_cover
    - operation: subtract
      name: cirque_flush
    - operation: subtract
      name: oled_window
    - operation: subtract
      name: indicator_holes
  pcb:
    - name: pcb_outline
    - operation: subtract
      name: pcb_mounting
    - operation: subtract
      name: tp_cable_slot           # the trackpad FFC goes through the PCB

  # ---- 3D case helper outlines ----
  edge_insert:      # 3.0 mm insert holes in the case wall (screws through the plate)
    - name: edge_mounting
      expand: 0.3
  case_wall:
    - name: case
    - operation: subtract
      name: tub_cavity
    - operation: subtract
      name: edge_insert

  # posts under the PCB, around each pcb_mounting hole (clipped to the PCB outline)
  # Post shapes, each expanded in its own outline: inside a multi-part outline
  # Ergogen applies a part's expand to the running result (expands compound).
  # Key-area screws go in from the top (plate -> spacer -> PCB) into M2
  # heat-set inserts in the posts under the PCB: post 5.5 mm, insert hole
  # 3.0 mm (5 mm posts tested OK; every 5.5 mm post keeps >= 0.2 mm off the
  # back-side parts on both halves - 0.07 mm tightest margin at c8_r2 right).
  insert_post:      # 5.5 mm post under the PCB at every screw
    - name: pcb_mounting
      expand: 1.55
  insert_hole:      # 3.0 mm hole for the M2 heat-set insert (key-area screws, top-down)
    - name: c9r5_screw
      expand: 0.3
  # Centre-cover screws. The 2 at the OLED go bottom-up: floor counterbore -> 5.5 mm
  # post (3.0 hole) -> PCB -> spacer -> M2 insert in a boss under the centre cover
  # (blind hole, nothing visible on the cover top). The 2 south of the trackpad go
  # top-down (user 2026-11-05, the cover's bosses there removed): cover counterbore ->
  # cover -> plate -> spacer (in the lid, PCB top -> plate) -> PCB -> M2 insert in the
  # top of the tub post (its 3.0 hole), about M2 x 8.
  cover_screw:
    - name: oled_screw
    - operation: add
      name: pcb_mounting_std
  cover_counterbore: # 4.4 mm screw head counterbore in the floor (1.6 deep)
    - name: cover_screw
      expand: 1.0
  cover_south_spacer: # 5.5 mm spacer in the lid, PCB top -> plate, at the south cover screws
    - name: pcb_mounting_std
      expand: 1.55
  cover_south_cbore: # 4.4 mm screw head counterbore in the cover top at the south screws
    - name: pcb_mounting_std
      expand: 1.0
  cover_insert_hole: # 3.0 mm insert hole: the 4 centre posts in the tubs
    - name: cover_screw
      expand: 0.3
  spacer_disc_key:  # 5.5 mm spacer between the PCB and the plate at the key-area screws
    - name: c9r5_screw
      expand: 1.55
  oled_spacer_disc: # 5.5 mm spacer between the PCB and the OLED module (separate part)
    - name: oled_screw
      expand: 1.55
  oled_spacer:
    - name: oled_spacer_disc
    - operation: subtract
      name: oled_screw

  standoffs_lower:   # posts, floor -> PCB bottom: inserts (key area) or clearance holes (cover screws)
    - name: insert_post
    - operation: subtract
      name: insert_hole
    - operation: subtract
      name: cover_insert_hole   # the 4 centre posts: 3.0 too (user 2026-11-04), the floor below keeps its 2.4 hole
    - operation: subtract
      name: pcb_mounting
    - operation: intersect
      name: tub_cavity

  # spacers between PCB and switch plate (lids), screw clearance hole
  standoffs_upper:
    - name: spacer_disc_key
    - operation: add
      name: cover_south_spacer
    - operation: subtract
      name: pcb_mounting
    - operation: intersect
      name: pcb_outline
  # Support crosses (no PCB holes): 2 mm walls along the key gaps at a switch
  # corner crossing (upper right corner; c7_r1: top middle), keys c4_r1 c4_r3
  # c4_r4 c7_r1 c8_r3 (hachigo74: the c1 crosses went with column c1). Lower cross: floor -> PCB bottom
  # (tubs), upper cross: plate -> PCB top (lids); together they back the PCB
  # against pressure from above. Each arm runs up to 5 mm and stops 0.3 mm
  # before the first obstacle (lower: back pads, socket bodies, diodes, LEDs,
  # caps, cutouts; upper: switch bodies, stab housings, front pads), the same
  # on both halves; arms under 2 mm are dropped (half crosses). Lower north arms
  # are blocked by the next key's socket body, so the lower crosses are mostly
  # T-shapes. Only spots with a lower cross are used.
  # hachigo74 crosses: upper right of c4_r1 and c3_r4; upper left of c7_r4 (c6/c7,
  # level since c7 lost its stagger); lower left of c8_r2 (c7/c8 at the r1/r2 gap).
  # crosses.py ... "c4_r1,c3_r4,c7_r4:-0.5:0.5,c8_r2:-0.5:-0.5"
  # Generated with tools/lib/crosses.py from the built board.
  cross_lower:
    - what: rectangle
      size: [2, 2]
      where:
        ref: hand-zone_c4_r1
        shift: [9.500, 9.500]
    - what: rectangle
      size: [2.50, 2]
      where:
        ref: hand-zone_c4_r1
        shift: [10.750, 9.500]
    - what: rectangle
      size: [5.00, 2]
      where:
        ref: hand-zone_c4_r1
        shift: [7.000, 9.500]
    - what: rectangle
      size: [2, 5.00]
      where:
        ref: hand-zone_c4_r1
        shift: [9.500, 7.000]
    - what: rectangle
      size: [2, 2]
      where:
        ref: mirror_hand-zone_c4_r1
        shift: [9.500, 9.500]
    - what: rectangle
      size: [2.50, 2]
      where:
