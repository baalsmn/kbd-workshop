# hachigo74: 74 keys (37 per half), from hachigo74/kle/hachigo74.json. Based on
# kugo82.yaml with column c1 removed (column names c2..c9 kept); c2-c4 adjusted
# to the layout. LED chain: 2 indicators + 74 key LEDs = 76.
units:
  sp: 19
  kc: 18.2
  sw: 14.1



points:
  # horizontal spacing between centerpoints:
  key.spread: sp 
  key.height: kc
  key.width: kc
  # vertical spacing between centerpoints:
  key.padding: sp #
  key.stagger: 0
  key.splay: 0
  # keycap width in U and stabilizer flag, read by the ks33_hotswap footprint
  key.keycap_u: 1
  key.stab: false
  zones:
    hand-zone:
      # Moves the whole keyboard (both halves) on the KiCad sheet.
      # x: right, y: negative = down on the KiCad sheet. Tune after the first run.
      anchor:
        shift: [50, -100]
      rotate: -15
      columns:
        c2:
          key.column_net: C2   # shared by the left and the mirrored key
          rows.r5.skip: true
          # hachigo74: c1 removed, c2 is the outer column now (names kept, so
          # every reference stays valid; the board just moves 1 sp on the sheet).
          # KLE: all 1U at 1.5 (c2 origin 1.0 -> r1 shift carries to r2..r4)
          rows.r1.shift: [0.5sp, 0]
          rows.r1.led_l_in: LED_7
          rows.r1.led_l_out: LED_8
          rows.r1.led_r_in: LED_72
          rows.r1.led_r_out: LED_73
          rows.r2.led_l_in: LED_6
          rows.r2.led_l_out: LED_7
          rows.r2.led_r_in: LED_73
          rows.r2.led_r_out: LED_74
          rows.r3.led_l_in: LED_5
          rows.r3.led_l_out: LED_6
          rows.r3.led_r_in: LED_74
          rows.r3.led_r_out: LED_75
          rows.r4.led_l_in: LED_DATA   # hachigo74: first key LED (c1 removed)
          rows.r4.led_l_out: LED_5
          rows.r4.led_r_in: LED_75
          rows.r4.led_r_out: LED_END   # last key LED (c1 removed)
        c3:
          key.column_net: C3   # shared by the left and the mirrored key
          key.spread: 1.25sp
          # hachigo74 KLE: r1-r4 1U at 2.5, r5 (Esc) 1.25U at 2.375 [U]; shifts carry over
          rows.r1.shift: [0.25sp,0]
          rows.r5.shift: [-0.125sp,0]
          rows.r5.keycap_u: 1.25
          rows.r1.led_l_in: LED_8
          rows.r1.led_l_out: LED_9
          rows.r1.led_r_in: LED_71
          rows.r1.led_r_out: LED_72
          rows.r2.led_l_in: LED_9
          rows.r2.led_l_out: LED_10
          rows.r2.led_r_in: LED_70
          rows.r2.led_r_out: LED_71
          rows.r3.led_l_in: LED_10
          rows.r3.led_l_out: LED_11
          rows.r3.led_r_in: LED_69
          rows.r3.led_r_out: LED_70
          rows.r4.led_l_in: LED_11
          rows.r4.led_l_out: LED_12
          rows.r4.led_r_in: LED_68
          rows.r4.led_r_out: LED_69
          rows.r5.led_l_in: LED_12
          rows.r5.led_l_out: LED_13
          rows.r5.led_r_in: LED_67
          rows.r5.led_r_out: LED_68
        c4:
          key.column_net: C4   # shared by the left and the mirrored key
          # KLE: column 1.25U from c3 (moves c4..c9 0.25U towards the centre),
          # hachigo74: all 1U at 3.5 (r1 = Right arrow)
          key.spread: 1.25sp
          rows.r1.led_l_in: LED_17
          rows.r1.led_l_out: LED_18
          rows.r1.led_r_in: LED_62
          rows.r1.led_r_out: LED_63
          rows.r2.led_l_in: LED_16
          rows.r2.led_l_out: LED_17
          rows.r2.led_r_in: LED_63
          rows.r2.led_r_out: LED_64
          rows.r3.led_l_in: LED_15
          rows.r3.led_l_out: LED_16
          rows.r3.led_r_in: LED_64
          rows.r3.led_r_out: LED_65
          rows.r4.led_l_in: LED_14
          rows.r4.led_l_out: LED_15
          rows.r4.led_r_in: LED_65
          rows.r4.led_r_out: LED_66
          rows.r5.led_l_in: LED_13
          rows.r5.led_l_out: LED_14
          rows.r5.led_r_in: LED_66
          rows.r5.led_r_out: LED_67
        c5:
          rows.r1.keycap_u: 2   # 2U bottom-row key with KS-57 stabilizer
          rows.r1.stab: true
          key.column_net: C5   # shared by the left and the mirrored key
          key.stagger: 0.25sp
          rows.r1.shift: [0.5sp,0]
          rows.r2.shift: [-0.5sp,0]
          rows.r1.led_l_in: LED_18
          rows.r1.led_l_out: LED_19
          rows.r1.led_r_in: LED_61
          rows.r1.led_r_out: LED_62
          rows.r2.led_l_in: LED_19
          rows.r2.led_l_out: LED_20
          rows.r2.led_r_in: LED_60
          rows.r2.led_r_out: LED_61
          rows.r3.led_l_in: LED_20
          rows.r3.led_l_out: LED_21
          rows.r3.led_r_in: LED_59
          rows.r3.led_r_out: LED_60
          rows.r4.led_l_in: LED_21
          rows.r4.led_l_out: LED_22
          rows.r4.led_r_in: LED_58
          rows.r4.led_r_out: LED_59
          rows.r5.led_l_in: LED_22
          rows.r5.led_l_out: LED_23
          rows.r5.led_r_in: LED_57
          rows.r5.led_r_out: LED_58
        c6:
          key.column_net: C6   # shared by the left and the mirrored key
          rows.r1.skip: true
          rows.r2.shift: [0,0]
          rows.r2.led_l_in: LED_26
          rows.r2.led_l_out: LED_27
          rows.r2.led_r_in: LED_53
          rows.r2.led_r_out: LED_54
          rows.r3.led_l_in: LED_25
          rows.r3.led_l_out: LED_26
          rows.r3.led_r_in: LED_54
          rows.r3.led_r_out: LED_55
          rows.r4.led_l_in: LED_24
          rows.r4.led_l_out: LED_25
          rows.r4.led_r_in: LED_55
          rows.r4.led_r_out: LED_56
          rows.r5.led_l_in: LED_23
          rows.r5.led_l_out: LED_24
          rows.r5.led_r_in: LED_56
          rows.r5.led_r_out: LED_57
        c7:
          rows.r1.keycap_u: 2   # 2U bottom-row key with KS-57 stabilizer
          rows.r1.stab: true
          key.column_net: C7   # shared by the left and the mirrored key
          key.stagger: -.25sp
          rows.r1.shift: [0.5sp,0]
          rows.r2.shift: [-0.5sp,0]
          rows.r1.led_l_in: LED_27
          rows.r1.led_l_out: LED_28
          rows.r1.led_r_in: LED_52
          rows.r1.led_r_out: LED_53
          rows.r2.led_l_in: LED_28
          rows.r2.led_l_out: LED_29
          rows.r2.led_r_in: LED_51
          rows.r2.led_r_out: LED_52
          rows.r3.led_l_in: LED_29
          rows.r3.led_l_out: LED_30
          rows.r3.led_r_in: LED_50
          rows.r3.led_r_out: LED_51
          rows.r4.led_l_in: LED_30
          rows.r4.led_l_out: LED_31
          rows.r4.led_r_in: LED_49
          rows.r4.led_r_out: LED_50
          rows.r5.led_l_in: LED_31
          rows.r5.led_l_out: LED_32
          rows.r5.led_r_in: LED_48
          rows.r5.led_r_out: LED_49
        c8:
          key.column_net: C8   # shared by the left and the mirrored key
          rows.r1.skip: true
          rows.r2.led_l_in: LED_35
          rows.r2.led_l_out: LED_36
          rows.r2.led_r_in: LED_44
          rows.r2.led_r_out: LED_45
          rows.r3.led_l_in: LED_34
          rows.r3.led_l_out: LED_35
          rows.r3.led_r_in: LED_45
          rows.r3.led_r_out: LED_46
          rows.r4.led_l_in: LED_33
          rows.r4.led_l_out: LED_34
          rows.r4.led_r_in: LED_46
          rows.r4.led_r_out: LED_47
          rows.r5.led_l_in: LED_32
          rows.r5.led_l_out: LED_33
          rows.r5.led_r_in: LED_47
          rows.r5.led_r_out: LED_48
        c9:
          key.column_net: C9   # shared by the left and the mirrored key
          key.stagger: -0.25sp   # KLE
          # kugo82: new 1U r5 key (F11 / F12)
          # KLE: r1 (Layer) 1.25U, extended towards the centre; r2 shifts back
          rows.r1.shift: [0.125sp, 0]
          rows.r1.keycap_u: 1.25
          rows.r2.shift: [-0.125sp, 0]
          rows.r1.led_l_in: LED_36
          rows.r1.led_l_out: LED_37
          rows.r1.led_r_in: LED_43
          rows.r1.led_r_out: LED_44
          rows.r2.led_l_in: LED_37
          rows.r2.led_l_out: LED_38
          rows.r2.led_r_in: LED_42
          rows.r2.led_r_out: LED_43
          rows.r3.led_l_in: LED_38
          rows.r3.led_l_out: LED_39
          rows.r3.led_r_in: LED_41
          rows.r3.led_r_out: LED_42
          rows.r4.led_l_in: LED_39
          rows.r4.led_l_out: LED_40
          rows.r4.led_r_in: LED_40b
          rows.r4.led_r_out: LED_41
          rows.r5.led_l_in: LED_40
          rows.r5.led_l_out: LED_40a
          rows.r5.led_r_in: LED_40a
          rows.r5.led_r_out: LED_40b
      rows:
        r1:
          row_net: R1        # left half
          row_net_r: R6      # right half
        r2:
          row_net: R2        # left half
          row_net_r: R7      # right half
        r3:
          row_net: R3        # left half
          row_net_r: R8      # right half
        r4:
          row_net: R4        # left half
          row_net_r: R9      # right half
        r5:
          row_net: R5        # left half
          row_net_r: R10      # right half

  mirror: &mirror
    ref: hand-zone_c9_r3
    shift: [.5sp, .5sp]
    distance: sp+40

outlines:


  switches_outline:
    - what: rectangle
      where: true
      size: [sw,sw]
  # Gateron KS-57 low-profile plate-mounted 2U stabilizer, plate cutout as
  # recommended in the KS-57B210T spec (stabs 24 mm apart, 6.0 x 12.5 each,
  # 1.7 mm lever notch, 2.5 mm channels into the switch cutout).
  # Notch side = south (towards the user), as drawn in the spec.
  stab_cutouts:
    - what: rectangle
      where: /_c[57]_r1$/
      size: [6, 12.5]
      adjust.shift: [-12, -0.6]
    - what: rectangle
      where: /_c[57]_r1$/
      size: [6, 12.5]
      adjust.shift: [12, -0.6]
    - what: rectangle
      where: /_c[57]_r1$/
      size: [1.7, 1.4]
      adjust.shift: [-12, -7.35]
    - what: rectangle
      where: /_c[57]_r1$/
      size: [1.7, 1.4]
      adjust.shift: [12, -7.35]
    - what: rectangle
      where: /_c[57]_r1$/
      size: [2.2, 2.5]
      adjust.shift: [-8.0, -1.4]
    - what: rectangle
      where: /_c[57]_r1$/
      size: [2.2, 2.5]
      adjust.shift: [8.0, -1.4]
  # 0.96" SSD1306 module, rotated 180 deg (header at the bottom, y 33.3,
  # just below the Helios), soldered on bare header pins ~1.2 mm above the
  # PCB (no plastic spacer), so it sits inside this plate cutout.
  # Window = display area (in the centre cover).
  oled:
    - what: rectangle
      size: [28.2, 28]
      corner: 1
      where:
        aggregate.parts: 
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        shift: [0, 35.7]    # kugo82: 9.8 mm south, cutout bottom 21.7 (1.5 above the trackpad ring)
  # visible screen: the 21.7 x 10.9 active area + ~0.6 mm margin
  oled_window:
    - what: rectangle
      size: [23, 12]
      corner: 1
      where:
        aggregate.parts: 
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        shift: [0, 36.35]
  # 2 indicator LEDs next to the c9_r1 keys, on their inner side (19.5 mm
  # from the key centre = 8 mm past the 1.25U keycap edge at 11.5): 3 mm light holes in
  # the plate. left = layout layer colour, right = function/layer lock (green).
  indicator_holes:
    - what: circle
      radius: 1.5
      where:
        ref: hand-zone_c9_r1
        shift: [19.5, 0]
    - what: circle
      radius: 1.5
      where:
        ref: mirror_hand-zone_c9_r1
        shift: [19.5, 0]
  # trackpad opening in the centre cover: around the snap ring (r 22.2) + 0.3 mm
  cirque_flush:
    - what: circle
      radius: 22.5
      where:
        aggregate.parts: 
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [0,-2]
  # Trackpad mounting: the TM040040 (5 mm thick without the connector, user
  # measured) lies directly on the switch plate (underside z 12.6, top 17.6),
  # level, no pocket in the plate. The plate has
  # an opening under the parts zone (r 18.1, parts stay inside r 18.0), so the
  # pad rests on its 2 mm parts-free rim. The connector sticks out 2.5 mm below
  # the pad (user measured), down to the PCB top (z 10.1); the PCB cutout
  # (tp_cable_slot, 12 x 5) gives it room and lets the FFC through to the Molex.
  # Anti-rotation: a peg on the centre cover (tp_cover_peg) sits in the pad's
  # south flat ("south notch"). Held from above by the snap ring
  # (trackpad_ring): stands on the plate around the pad, lip over the pad edge;
  # 3 claws flush with the ring wall hook under the cover bottom edge (plate
  # cutouts give the hooks room).
  # PCB cutout under the trackpad connector: the connector sticks out 2.5 mm
  # below the pad (user measured), i.e. down to the PCB top exactly, so the
  # cutout takes the whole connector body comfortably (12-pin 0.5 mm vertical,
  # ~10 x 3 mm) and the FFC goes straight down, then bends into the Molex
  tp_cable_slot:
    - what: rectangle
      size: [12, 5]
      corner: 1
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [0.000, -17.400]
  # plate opening under the pad's parts zone (pad rests on its rim around it)
  tp_plate_opening:
    - what: circle
      radius: 18.1
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [0, -2]
  # peg on the plate against the pad's south flat (flat at r 19.7 -> y -21.7)
  # peg on the centre cover: from the cover opening edge (r 22.5 -> y -24.5)
  # to the pad's south flat (r 19.7 -> y -21.7, 0.05 mm gap), up to the cover top
  tp_cover_peg:
    - what: rectangle
      size: [5, 3.4]
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [0.000, -23.450]
  # room for the peg in the ring wall (0.2 mm around it)
  # room for the cover peg in the ring wall (0.2 mm around it, through the wall)
  tp_key_notch:
    - what: rectangle
      size: [5.4, 2.8]
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [0.000, -23.000]
  tp_pad_pocket:     # round pad pocket in the ring: 40 mm pad + 0.2 mm
    - what: circle
      radius: 20.2
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [0, -2]
  tp_outline:        # the pad itself: 40 mm round, cut flat top and bottom (39.40 across)
    - what: circle
      radius: 20
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [0, -2]
    - what: rectangle
      size: [41, 39.4]
      operation: intersect
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [0, -2]
  tp_ring_wall:
    - what: circle
      radius: 22.2
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [0, -2]
    - operation: subtract
      name: tp_pad_pocket
    - operation: subtract
      name: tp_key_notch
  # ring claws (2: east / west), 8 mm wide, flush with the ring wall (nothing
  # sticks out): a 8 mm arc of the wall's outer 1 mm is cut free by two 0.5 mm
  # slits (z 12.6-16.0) with the inner wall behind it relieved, so it flexes
  # inward; below the ring it carries a hook reaching 0.5 mm past the cover
  # opening edge (r 22.5 -> 23.0) that catches under the cover bottom (z 12.6).
  # The plate has a cutout under each claw for the hook. Arc segments (ring
  # shapes cut to the claw zone), so nothing bulges past the ring's round edge.
  tp_claw_zone:     # 8 mm wide zones, radial r 15-25
    - what: rectangle
      size: [8, 10]
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: -90
        shift: [20.000, -2.000]
    - what: rectangle
      size: [8, 10]
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 90
        shift: [-20.000, -2.000]
  tp_claw_zone_wide: # zones for the plate cutout (8 + 1.2 mm)
    - what: rectangle
      size: [9.2, 10]
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: -90
        shift: [20.000, -2.000]
    - what: rectangle
      size: [9.2, 10]
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 90
        shift: [-20.000, -2.000]
  tp_claw_slit_zone: # 2 x 0.5 mm strips at the claw edges
    - what: rectangle
      size: [0.5, 10]
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: -90
        shift: [20.000, 2.250]
    - what: rectangle
      size: [0.5, 10]
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: -90
        shift: [20.000, -6.250]
    - what: rectangle
      size: [0.5, 10]
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 90
        shift: [-20.000, -6.250]
    - what: rectangle
      size: [0.5, 10]
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 90
        shift: [-20.000, 2.250]
  tp_ann_arm: # r 21.2-22.2
    - what: circle
      radius: 22.2
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [0.000, -2.000]
    - operation: subtract
      what: circle
      radius: 21.2
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [0.000, -2.000]
  tp_ann_hook: # r 21.2-23.0
    - what: circle
      radius: 23
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [0.000, -2.000]
    - operation: subtract
      what: circle
      radius: 21.2
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [0.000, -2.000]
  tp_ann_relief: # r 20.0-21.2
    - what: circle
      radius: 21.2
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [0.000, -2.000]
    - operation: subtract
      what: circle
      radius: 20
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [0.000, -2.000]
  tp_ann_slit: # r 20.0-22.4
    - what: circle
      radius: 22.4
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [0.000, -2.000]
    - operation: subtract
      what: circle
      radius: 20
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [0.000, -2.000]
  tp_ann_plate: # r 20.8-23.6
    - what: circle
      radius: 23.6
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [0.000, -2.000]
    - operation: subtract
      what: circle
      radius: 20.8
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [0.000, -2.000]
  tp_claw_slit:      # slits through the wall
    - name: tp_ann_slit
    - operation: intersect
      name: tp_claw_slit_zone
  tp_claw_relief:    # inner wall behind the claw removed
    - name: tp_ann_relief
    - operation: intersect
      name: tp_claw_zone
  tp_claw_arm:       # claw below the ring, z 11.9-12.6
    - name: tp_ann_arm
    - operation: intersect
      name: tp_claw_zone
  tp_claw_hook:      # hook, z 11.9-12.55 (under the cover bottom)
    - name: tp_ann_hook
    - operation: intersect
      name: tp_claw_zone
  tp_claw_plate_cut: # plate cutout for the claw and hook
    - name: tp_ann_plate
    - operation: intersect
      name: tp_claw_zone_wide
  tp_ring_lip:
    - what: circle
      radius: 22.2
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [0, -2]
    - what: circle
      radius: 19.3
      operation: subtract
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [0, -2]
  # Centre cover outline (from the user's draft): a strip parallel to the
  # OLED, 33 mm wide (OLED pocket +-14.1 + 2.4 mm wall),
  # widening into a circle r 25 around the trackpad (concentric,
  # 2.8 mm outside the snap ring), top and bottom edges straight: top 2.4 mm
  # above the OLED cutout, bottom 2.4 mm past the south screws; corners r 3.
  center_cover_raw:
    - what: rectangle
      size: [33, 85.2]
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [0, 9.5]      # y -33.1 .. 52.1: 2.4 mm past the south screw holes (-29.5, r 1.2) and above the OLED cutout top (49.7), same 2.4 mm as at the sides
    - what: circle
      radius: 25
      operation: add
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [0, -2]
  cirque_cover:
    - name: center_cover_raw
      fillet: 3
  # Key-area screws (kugo82, user's choice): one at c2_r2 and one at c5_r3 per
  # half, at switch corner crossings. Everything else under the keys was removed
  # (screws and studs): the case-wall screws hold the lid and tub together.
  # Clearance (5.5 mm insert post): room on the back >= 3.55 mm, switch bodies
  # >= 2.5 mm, cutouts >= 6.7 mm, on both halves.
  c9r5_screw:
    - what: circle
      radius: 1.2
      where:
        ref: hand-zone_c2_r2
        shift: [9.5, 9.0]   # c2/c3 at r2/r3 (NE corner; hachigo74: moved from [10.5, 8.5], c2/c3 keys shifted)
    - what: circle
      radius: 1.2
      where:
        ref: mirror_hand-zone_c2_r2
        shift: [9.5, 9.0]   # c2/c3 at r2/r3 (NE corner; hachigo74: moved from [10.5, 8.5], c2/c3 keys shifted)
    - what: circle
      radius: 1.2
      where:
        ref: hand-zone_c5_r3
        shift: [9.0, -10.5]   # c5/c6 at r2/r3 (SE corner; the west corners have only 1.1 mm room)
    - what: circle
      radius: 1.2
      where:
        ref: mirror_hand-zone_c5_r3
        shift: [9.0, -10.5]   # c5/c6 at r2/r3 (SE corner; the west corners have only 1.1 mm room)
  # Screws through the OLED module's 2 bottom corner holes (module footprint
  # (+-11.176, 0.635) from the header row, rotated 180 deg). Below the PCB a
  # 5.5 mm insert post (insert_post), above it a 1.2 mm spacer up to the module
  # underside (separate printed part oled_spacers). They also hold the centre
  # cover (holes through every layer, like pcb_mounting).
  oled_screw:
    - what: circle
      radius: 1.2
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [11.176, 24.135]
    - what: circle
      radius: 1.2
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [-11.176, 24.135]
  pcb_mounting_std: # standard mounting holes (7.4 mm posts): only the cover screws south of the trackpad
    # key-area screws moved to the thin-post group (c9r5_screw), kugo82
    # centre cover screws, south of the trackpad
    # (the 2 north ones go through the OLED holes, see oled_screw)
    - what: circle
      radius: 1.2
      where:
        aggregate.parts: 
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [-11, -29.5]
    - what: circle
      radius: 1.2
      where:
        aggregate.parts: 
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [11, -29.5]
  pcb_mounting: # all mounting holes, cut through every part
    - name: pcb_mounting_std
    - operation: add
      name: c9r5_screw
    - operation: add
      name: oled_screw

  edge_mounting: # mounting holes case elements only
    # left bottom
    - what: circle
      radius: 1.2
      where:
        - ref: hand-zone_c2_r1
          shift: [-0.5sp-5.5, -0.75sp-5.5]   # 3.5 mm diagonally off the PCB corner
    - what: circle
      radius: 1.2
      where:
        - ref: mirror_hand-zone_c2_r1
          shift: [-0.5sp-5.5, -0.75sp-5.5]   # 3.5 mm diagonally off the PCB corner 
    # left top corner
    - what: circle
      radius: 1.2
      where:
        - ref: hand-zone_c2_r4
          shift: [-(0.5sp+5), (0.5sp + 5)]
    - what: circle
      radius: 1.2
      where:
        - ref: mirror_hand-zone_c2_r4
          shift: [-(0.5sp+5), (0.5sp + 5)]
    # top left second corner
    - what: circle
      radius: 1.2
      where:
        - ref: hand-zone_c3_r5
          shift: [-(0.5sp+4), (0.5sp + 5)]
    - what: circle
      radius: 1.2
      where:
        - ref: mirror_hand-zone_c3_r5
          shift: [-(0.5sp+4), (0.5sp + 5)]
    #  center hole
    - what: circle
      radius: 1.2
      where:
        - ref: hand-zone_c5_r5
          shift: [0.5sp, (0.5sp + 6)]   # 4 mm off the PCB edge, centred in the 8 mm wall
    - what: circle
      radius: 1.2
      where:
        - ref: mirror_hand-zone_c5_r5
          shift: [0.5sp, (0.5sp + 6)]   # 4 mm off the PCB edge, centred in the 8 mm wall
    # bottom center hole
    - what: circle
      radius: 1.2
      where:
        - ref: hand-zone_c5_r1
          shift: [0, -sp-6]   # 4 mm below the PCB edge (c5_r1 sits 0.25sp up)
    - what: circle
      radius: 1.2
      where:
        - ref: mirror_hand-zone_c5_r1
          shift: [0, -sp-6]   # 4 mm below the PCB edge (c5_r1 sits 0.25sp up)
    # top right C9 corner
    - what: circle
      radius: 1.2
      where:
        - ref: hand-zone_c8_r5
          shift: [(0.5sp), (0.5sp + 6)]   # 4 mm off the PCB edge
    - what: circle
      radius: 1.2
      where:
        - ref: mirror_hand-zone_c8_r5
          shift: [(0.5sp), (0.5sp + 6)]   # 4 mm off the PCB edge

    #   center two dots
#    - what: circle
#      radius: 1.2
#      where:
#        aggregate.parts: 
#          - hand-zone_c8_r5
#          - mirror_hand-zone_c8_r5
#        shift: [-10, 12.5]
#    - what: circle
#      radius: 1.2
#      where:
#        aggregate.parts: 
#          - hand-zone_c8_r5
#          - mirror_hand-zone_c8_r5
#        shift: [10, 12.5]
    - what: circle
      radius: 1.2
      where:
        - ref: hand-zone_c9_r1
          shift: [(0.5sp+3), -(0.5sp + 6)]   # 4 mm below the PCB edge
    - what: circle
      radius: 1.2
      where:
        - ref: mirror_hand-zone_c9_r1
          shift: [(0.5sp+3), -(0.5sp + 6)]   # 4 mm below the PCB edge
  # PCB outline before its 2 mm rounding: the case is grown from this one so
  # its outer corners can be sharp-then-filleted (r 3) instead of r 10 / r 12
  pcb_core:
    - what: polygon
      operation: stack
      points: 
        # starting at the left bottom corner
        # bottom long edges: 0.5sp below c9_r1 (same as the top edge above
        # c6_r5), parallel to the key rows back to c1_r1 (c9 stagger -0.25sp)
        - ref: hand-zone_c2_r1
          shift: [-0.5sp,-0.75sp]    # hachigo74: c2 is the outer column
        - ref: hand-zone_c2_r4
          shift: [-0.5sp, 0.5sp]     # 1U key: left edge 0.5U from its centre
        - ref: hand-zone_c2_r4
          shift: [0.375sp, 0.5sp]    # step lined up with the c3_r5 (Esc) left edge
        - ref: hand-zone_c3_r5
          shift: [-0.5sp, 0.5sp]
        - ref: hand-zone_c4_r5
          shift: [0.5sp, 0.5sp]
        - ref: hand-zone_c5_r5
          shift: [-0.5sp, 0.5sp]
        - ref: hand-zone_c6_r5
          shift: [0.5sp, 0.5sp]
        - ref: hand-zone_c7_r5
          shift: [-0.5sp, 0.5sp]
        - ref: hand-zone_c8_r5
          shift: [0.5sp, 0.5sp]
        # going over to the mirrored half on top
        - ref: mirror_hand-zone_c8_r5
          shift: [0.5sp, 0.5sp]
        - ref: mirror_hand-zone_c7_r5
          shift: [-0.5sp, 0.5sp]
        - ref: mirror_hand-zone_c6_r5
          shift: [0.5sp, 0.5sp]
        - ref: mirror_hand-zone_c5_r5
          shift: [-0.5sp, 0.5sp]
        - ref: mirror_hand-zone_c4_r5
          shift: [0.5sp, 0.5sp]
        - ref: mirror_hand-zone_c3_r5
          shift: [-0.5sp, 0.5sp]
        - ref: mirror_hand-zone_c2_r4
          shift: [0.375sp, 0.5sp]
        - ref: mirror_hand-zone_c2_r4
          shift: [-0.5sp, 0.5sp]
        - ref: mirror_hand-zone_c2_r1
          shift: [-0.5sp,-0.75sp]
        - ref: mirror_hand-zone_c9_r1
          shift: [0.5sp, -0.5sp]
        - ref: mirror_hand-zone_c9_r1
          shift: [sp, -0.5sp]
        # back to th eoriginal at the bottom
        - ref: hand-zone_c9_r1
          shift: [sp, -0.5sp]
        - ref: hand-zone_c9_r1
          shift: [0.5sp, -0.5sp]

  pcb_outline: # pcb board outline
    - name: pcb_core
      expand: 2

  # case outline: 8 mm wall around the PCB (pcb_core + 2 + 8), pointed joints,
  # then every corner rounded r 3
  case:
    - what: outline
      name: pcb_core
      expand: 10
      joints: pointy
      fillet: 3
  

  # Hole in the case floor right under the Helios reset button (SW1, Panasonic
  # EVP-AF on the Helios component side, which faces down: the Helios sits
  # upside down on the back). Helios board: SW1 at (+4.885, +11.715) from the
  # board centre (y down); mirrored on the back -> x -4.885; board centre is
  # 1.115 north of the footprint origin (0, 54.7) -> (-4.885, 44.10).
  # Press it with a pin/paperclip from below (double-tap = UF2 bootloader).
  # Pin channel: 1.3 mm bore (prints ~1.1-1.2, takes a 0.8-1 mm SIM tool or
  # paperclip) through the 3 mm floor and a 1.8 mm boss on top of it, so the
  # pin is guided 4.8 mm straight up at the button (boss top z 4.8, ~2 mm
  # under the Helios' component side at z 6.9).
  mcu_reset_hole:
    - what: circle
      radius: 0.65
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [-4.885, 44.10]

  mcu_reset_disc:
    - what: circle
      radius: 1.6
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [-4.885, 44.10]
  mcu_reset_boss:
    - name: mcu_reset_disc
    - operation: subtract
      name: mcu_reset_hole

  case_bottom:  # base plate w mounting cutouts
    - name: case
    - operation: subtract
      name: pcb_mounting
    - operation: subtract
      name: edge_mounting
    - operation: subtract
      name: mcu_reset_hole

  # Centre cover (follows cirque_cover):
  #   low layer: plate top -> OLED glass top, pocket for the OLED module
  #   top layer: OLED glass top -> z 15.5, with the screen window
  center_cover_low:
    - name: cirque_cover
    - operation: subtract
      name: cirque_flush
    - operation: subtract
      name: oled
    - operation: subtract
      name: indicator_holes
  center_cover_top:
    - name: cirque_cover
    - operation: subtract
      name: cirque_flush
    - operation: subtract
      name: oled_window
    - operation: subtract
      name: indicator_holes
  pcb:
    - name: pcb_outline
    - operation: subtract
      name: pcb_mounting
    - operation: subtract
      name: tp_cable_slot           # the trackpad FFC goes through the PCB

  # ---- 3D case helper outlines ----
  edge_insert:      # 3.0 mm insert holes in the case wall (screws through the plate)
    - name: edge_mounting
      expand: 0.3
  case_wall:
    - name: case
    - operation: subtract
      name: pcb_outline
    - operation: subtract
      name: edge_insert

  # posts under the PCB, around each pcb_mounting hole (clipped to the PCB outline)
  # Post shapes, each expanded in its own outline: inside a multi-part outline
  # Ergogen applies a part's expand to the running result (expands compound).
  # Key-area screws go in from the top (plate -> spacer -> PCB) into M2
  # heat-set inserts in the posts under the PCB: post 5.5 mm, insert hole
  # 3.0 mm (5 mm posts tested OK; every 5.5 mm post keeps >= 0.2 mm off the
  # back-side parts on both halves - 0.07 mm tightest margin at c8_r2 right).
  insert_post:      # 5.5 mm post under the PCB at every screw
    - name: pcb_mounting
      expand: 1.55
  insert_hole:      # 3.0 mm hole for the M2 heat-set insert (key-area screws, top-down)
    - name: c9r5_screw
      expand: 0.3
  # Centre-cover screws (OLED south holes + the 2 south of the trackpad) go
  # bottom-up: floor counterbore -> 5.5 mm post (clearance hole) -> PCB ->
  # spacer / boss -> M2 insert in a boss under the centre cover (blind hole,
  # nothing visible on the cover top).
  cover_screw:
    - name: oled_screw
    - operation: add
      name: pcb_mounting_std
  cover_counterbore: # 4.4 mm screw head counterbore in the floor (1.6 deep)
    - name: cover_screw
      expand: 1.0
  cover_boss_south: # 5.5 mm boss under the cover, down through the plate to the PCB top
    - name: pcb_mounting_std
      expand: 1.55
  cover_boss_south_hole: # plate hole for it (6.0 mm)
    - name: pcb_mounting_std
      expand: 1.8
  cover_boss_oled:  # 5 mm boss under the cover, standing on the OLED board (5.5 would touch the glass edge)
    - name: oled_screw
      expand: 1.3
  cover_insert_hole: # 3.0 mm blind insert hole in the cover bosses
    - name: cover_screw
      expand: 0.3
  spacer_disc_key:  # 5.5 mm spacer between the PCB and the plate at the key-area screws
    - name: c9r5_screw
      expand: 1.55
  oled_spacer_disc: # 5.5 mm spacer between the PCB and the OLED module (separate part)
    - name: oled_screw
      expand: 1.55
  oled_spacer:
    - name: oled_spacer_disc
    - operation: subtract
      name: oled_screw

  standoffs_lower:   # posts, floor -> PCB bottom: inserts (key area) or clearance holes (cover screws)
    - name: insert_post
    - operation: subtract
      name: insert_hole
    - operation: subtract
      name: pcb_mounting
    - operation: intersect
      name: pcb_outline

  # spacers between PCB and switch plate (lids), screw clearance hole
  standoffs_upper:
    - name: spacer_disc_key
    - operation: subtract
      name: pcb_mounting
    - operation: intersect
      name: pcb_outline
  # Support crosses (no PCB holes): 2 mm walls along the key gaps at a switch
  # corner crossing (upper right corner; c7_r1: top middle), keys c4_r1 c4_r3
  # c4_r4 c7_r1 c8_r3 (hachigo74: the c1 crosses went with column c1). Lower cross: floor -> PCB bottom
  # (tubs), upper cross: plate -> PCB top (lids); together they back the PCB
  # against pressure from above. Each arm runs up to 5 mm and stops 0.3 mm
  # before the first obstacle (lower: back pads, socket bodies, diodes, LEDs,
  # caps, cutouts; upper: switch bodies, stab housings, front pads), the same
  # on both halves; arms under 2 mm are dropped (half crosses). Lower north arms
  # are blocked by the next key's socket body, so the lower crosses are mostly
  # T-shapes; c8_r3 has no lower cross (the corner itself is blocked).
  # Generated with crosses.py (scratch) from the built board.
  cross_lower:
    - what: rectangle
      size: [2, 2]
      where:
        ref: hand-zone_c4_r1
        shift: [9.500, 9.500]
    - what: rectangle
      size: [2.50, 2]
      where:
        ref: hand-zone_c4_r1
        shift: [10.750, 9.500]
    - what: rectangle
      size: [5.00, 2]
      where:
        ref: hand-zone_c4_r1
        shift: [7.000, 9.500]
    - what: rectangle
      size: [2, 5.00]
      where:
        ref: hand-zone_c4_r1
        shift: [9.500, 7.000]
    - what: rectangle
      size: [2, 2]
      where:
        ref: mirror_hand-zone_c4_r1
        shift: [9.500, 9.500]
    - what: rectangle
      size: [2.50, 2]
      where:
        ref: mirror_hand-zone_c4_r1
        shift: [10.750, 9.500]
    - what: rectangle
      size: [5.00, 2]
      where:
        ref: mirror_hand-zone_c4_r1
        shift: [7.000, 9.500]
