      where:
        ref: hand-zone_c4_r4
        shift: [7.000, 9.500]
    - what: rectangle
      size: [2, 5.00]
      where:
        ref: hand-zone_c4_r4
        shift: [9.500, 7.000]
    - what: rectangle
      size: [2, 2]
      where:
        ref: mirror_hand-zone_c4_r4
        shift: [9.500, 9.500]
    - what: rectangle
      size: [2, 5.00]
      where:
        ref: mirror_hand-zone_c4_r4
        shift: [9.500, 12.000]
    - what: rectangle
      size: [5.00, 2]
      where:
        ref: mirror_hand-zone_c4_r4
        shift: [7.000, 9.500]
    - what: rectangle
      size: [2, 5.00]
      where:
        ref: mirror_hand-zone_c4_r4
        shift: [9.500, 7.000]
    - what: rectangle
      size: [2, 2]
      where:
        ref: hand-zone_c7_r1
        shift: [0.000, 9.500]
    - what: rectangle
      size: [5.00, 2]
      where:
        ref: hand-zone_c7_r1
        shift: [2.500, 9.500]
    - what: rectangle
      size: [2, 5.00]
      where:
        ref: hand-zone_c7_r1
        shift: [0.000, 12.000]
    - what: rectangle
      size: [5.00, 2]
      where:
        ref: hand-zone_c7_r1
        shift: [-2.500, 9.500]
    - what: rectangle
      size: [2, 2]
      where:
        ref: mirror_hand-zone_c7_r1
        shift: [0.000, 9.500]
    - what: rectangle
      size: [5.00, 2]
      where:
        ref: mirror_hand-zone_c7_r1
        shift: [2.500, 9.500]
    - what: rectangle
      size: [2, 5.00]
      where:
        ref: mirror_hand-zone_c7_r1
        shift: [0.000, 12.000]
    - what: rectangle
      size: [5.00, 2]
      where:
        ref: mirror_hand-zone_c7_r1
        shift: [-2.500, 9.500]
    - what: rectangle
      size: [2, 2]
      where:
        ref: hand-zone_c8_r3
        shift: [9.500, 9.500]
    - what: rectangle
      size: [2, 5.00]
      where:
        ref: hand-zone_c8_r3
        shift: [9.500, 12.000]
    - what: rectangle
      size: [5.00, 2]
      where:
        ref: hand-zone_c8_r3
        shift: [7.000, 9.500]
    - what: rectangle
      size: [2, 5.00]
      where:
        ref: hand-zone_c8_r3
        shift: [9.500, 7.000]
    - what: rectangle
      size: [2, 2]
      where:
        ref: mirror_hand-zone_c8_r3
        shift: [9.500, 9.500]
    - what: rectangle
      size: [2, 5.00]
      where:
        ref: mirror_hand-zone_c8_r3
        shift: [9.500, 12.000]
    - what: rectangle
      size: [5.00, 2]
      where:
        ref: mirror_hand-zone_c8_r3
        shift: [7.000, 9.500]
    - what: rectangle
      size: [2, 5.00]
      where:
        ref: mirror_hand-zone_c8_r3
        shift: [9.500, 7.000]
  # Silkscreen markers of every case support touching the PCB, so they show in
  # KiCad: back = screw posts + lower crosses, front = OLED spacers + trackpad outline. Built from the
  # same outlines the case uses, so they always match.
  support_marks_back:
    - name: insert_post
    - operation: add
      name: cross_lower
  support_marks_front:
    - name: oled_spacer_disc
    - operation: add
      name: cover_boss_south
    - operation: add
      name: cross_upper
    - operation: add       # trackpad outline
      name: tp_outline

  # switch plate (lid) with all cutouts
  plate_clean:
    - name: case
    - operation: subtract
      name: switches_outline
    - operation: subtract
      name: stab_cutouts
    - operation: subtract
      name: edge_mounting
    - operation: subtract
      name: pcb_mounting
    - operation: subtract
      name: tp_plate_opening      # under the trackpad's parts zone
    - operation: subtract
      name: cover_boss_south_hole # the cover's south screw bosses reach through the plate
    - operation: subtract
      name: tp_claw_plate_cut      # room for the ring claws and hooks under the cover
    - operation: subtract
      name: oled
    - operation: subtract
      name: indicator_holes

  # USB-C plug opening through the north case wall, in front of the Helios
  # receptacle (receptacle face ~1 mm inside the PCB edge at y 73.28).
  # 13 mm wide for the plug overmold; cut from y 72 to past the 10 mm wall.
  usb_cutout:
    - what: rectangle
      size: [13, 12.5]
      corner: 1
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [0, 72 + 6.25]
  # Big rectangles used to split the case into a left and a right half.
  # They are centred on the mirror axis (the middle of the two c9_r2 keys).
  cut_left:
    - what: rectangle
      size: [600, 600]
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [-300, 0]
  cut_right:
    - what: rectangle
      size: [600, 600]
      where:
        aggregate.parts:
          - hand-zone_c9_r2
          - mirror_hand-zone_c9_r2
        rotate: 0
        shift: [300, 0]


cases:
  # Z stack-up (mm): bottom 3.0 | under-PCB clearance 5.5 (Helios 1.6 board +
  # ~3.3 USB-C receptacle hang below the PCB) | PCB 1.6 | gap to plate 1.3 |
  # plate 1.2  -> plate top 12.6.  Z (case coords): floor top 3, PCB bottom
  # 8.5, PCB top 10.1, plate 11.4-12.6, OLED glass top 13.95, cover top 15.5,
  # trackpad 12.6-17.6 on the plate (5 mm, user measured; connector down to 10.1), ring lip 17.7-18.5.
  # Every printed part is clipped to the "case" outline so nothing can stick out
  # past the case edge, then cut in half on the mirror axis.
  #
  # Tub = bottom plate + walls + screw posts + the reset pin boss, with the USB-C plug opening in the north wall.
  # The trackpad lies on the plate, the centre cover carries its anti-rotation
  # peg, the separate trackpad_ring part snaps into the cover.
  tub_left:
    - name: case_bottom
      extrude: 3
    - name: case_wall
      shift: [0, 0, 3]
      extrude: 8.4
    - name: standoffs_lower
      shift: [0, 0, 3]
      extrude: 5.5
    - name: cross_lower
      shift: [0, 0, 3]
      extrude: 5.5     # floor top -> PCB bottom
    - name: mcu_reset_boss
      shift: [0, 0, 3]
      extrude: 1.8
    - name: usb_cutout
      operation: subtract
      shift: [0, 0, 1.5]   # plug axis ~3.2 below the PCB bottom, +-3.75
      extrude: 7.5
    - name: cover_counterbore
      operation: subtract
      shift: [0, 0, 0]
      extrude: 1.6     # screw heads of the bottom-up cover screws
    - name: case
      operation: intersect
      extrude: 30
    - name: cut_left
      operation: intersect
      extrude: 30
  tub_right:
    - name: case_bottom
      extrude: 3
    - name: case_wall
      shift: [0, 0, 3]
      extrude: 8.4
    - name: standoffs_lower
      shift: [0, 0, 3]
      extrude: 5.5
    - name: cross_lower
      shift: [0, 0, 3]
      extrude: 5.5     # floor top -> PCB bottom
    - name: mcu_reset_boss
      shift: [0, 0, 3]
      extrude: 1.8
    - name: usb_cutout
      operation: subtract
      shift: [0, 0, 1.5]
      extrude: 7.5
    - name: cover_counterbore
      operation: subtract
      shift: [0, 0, 0]
      extrude: 1.6
    - name: case
      operation: intersect
      extrude: 30
    - name: cut_right
      operation: intersect
      extrude: 30

  lid_left:    # switch plate + upper spacers (print plate-side down)
    - name: plate_clean
      shift: [0, 0, 11.4]
      extrude: 1.2
    - name: standoffs_upper
      shift: [0, 0, 10.1]
      extrude: 1.3
    - name: cross_upper
      shift: [0, 0, 10.1]
      extrude: 1.3     # PCB top -> plate underside
    - name: case
      operation: intersect
      extrude: 30
    - name: cut_left
      operation: intersect
      extrude: 30
  lid_right:
    - name: plate_clean
      shift: [0, 0, 11.4]
      extrude: 1.2
    - name: standoffs_upper
      shift: [0, 0, 10.1]
      extrude: 1.3
    - name: cross_upper
      shift: [0, 0, 10.1]
      extrude: 1.3     # PCB top -> plate underside
    - name: case
      operation: intersect
      extrude: 30
    - name: cut_right
      operation: intersect
      extrude: 30

  # Centre cover (print separately, sits on the plate, screwed through the
  # 4 holes around the trackpad): low layer plate top -> OLED glass top
  # (pocket for the OLED module), top layer -> z 15.5; opening around the
  # trackpad snap ring.
  center_cover:
    - name: center_cover_low
      shift: [0, 0, 12.6]
      extrude: 1.35
    - name: center_cover_top
      shift: [0, 0, 13.95]
      extrude: 1.55
    - name: tp_cover_peg     # trackpad anti-rotation peg, up to the cover top
      shift: [0, 0, 12.6]
      extrude: 2.9
    - name: cover_boss_south # down through the plate to the PCB top
      shift: [0, 0, 10.1]
      extrude: 2.5
    - name: cover_boss_oled  # down onto the OLED board top (z 12.5)
      shift: [0, 0, 12.5]
      extrude: 1.45
    - name: cover_insert_hole
      operation: subtract
      shift: [0, 0, 10.1]
      extrude: 3.5     # south bosses: insert 10.1-13.6, 1.9 mm solid cover above
    - name: cover_insert_hole
      operation: subtract
      shift: [0, 0, 12.5]
      extrude: 2.7     # OLED bosses: 2.7 mm deep, 0.3 mm skin at the top (short M2 insert)

  # Trackpad snap ring (print separately, top down): wall on the plate around
  # the 5 mm pad up to 0.1 mm above it, lip over the pad edge, 3 claws flush
  # with the wall that hook under the centre cover's bottom edge.
  trackpad_ring:
    - name: tp_ring_wall
      shift: [0, 0, 12.6]
      extrude: 5.1     # up to 0.1 mm above the 5 mm pad (z 17.7)
    - name: tp_ring_lip
      shift: [0, 0, 17.7]
      extrude: 0.8     # lip over the pad edge (z 17.7-18.5)
    - name: tp_claw_arm
      shift: [0, 0, 11.9]
      extrude: 0.7
    - name: tp_claw_hook
      shift: [0, 0, 11.9]
      extrude: 0.65
    - name: tp_claw_slit
      operation: subtract
      shift: [0, 0, 12.6]
      extrude: 3.4     # slits up to z 16.0, the claw hangs from the wall above
    - name: tp_claw_relief
      operation: subtract
      shift: [0, 0, 12.6]
      extrude: 3.4

  # 2 spacers for the OLED screws (PCB top -> module underside, 1.2 mm, 5.5 mm dia)
  oled_spacers:
    - name: oled_spacer
      shift: [0, 0, 10.1]
      extrude: 1.2

  assembly:    # whole case in one piece, for checking only
    - name: case_bottom
      extrude: 3
    - name: case_wall
      shift: [0, 0, 3]
      extrude: 8.4
    - name: standoffs_lower
      shift: [0, 0, 3]
      extrude: 5.5
    - name: cross_lower
      shift: [0, 0, 3]
      extrude: 5.5     # floor top -> PCB bottom
    - name: mcu_reset_boss
      shift: [0, 0, 3]
      extrude: 1.8
    - name: standoffs_upper
      shift: [0, 0, 10.1]
      extrude: 1.3
    - name: cross_upper
      shift: [0, 0, 10.1]
      extrude: 1.3     # PCB top -> plate underside
    - name: plate_clean
      shift: [0, 0, 11.4]
      extrude: 1.2
    - name: center_cover_low
      shift: [0, 0, 12.6]
      extrude: 1.35
    - name: center_cover_top
      shift: [0, 0, 13.95]
      extrude: 1.55
    - name: tp_cover_peg
      shift: [0, 0, 12.6]
      extrude: 2.9
    - name: tp_ring_wall
      shift: [0, 0, 12.6]
      extrude: 5.1     # up to 0.1 mm above the 5 mm pad (z 17.7)
    - name: tp_ring_lip
      shift: [0, 0, 17.7]
      extrude: 0.8
    - name: tp_claw_arm
      shift: [0, 0, 11.9]
      extrude: 0.7
    - name: usb_cutout
      operation: subtract
      shift: [0, 0, 1.5]
      extrude: 7.5
    - name: case
      operation: intersect
      extrude: 30

pcbs:
  hachigo74:
    template: kicad8

    outlines:
      main:
        outline: pcb
      support_marks_back:
        outline: support_marks_back
        layer: B.SilkS
      support_marks_front:
        outline: support_marks_front
        layer: F.SilkS
    footprints:
      # Custom footprint "ks33_hotswap" is NOT defined in this file.
      # It comes from ks33_hotswap.js (web UI: Injections -> footprint named
      # ks33_hotswap; CLI: footprints/ks33_hotswap.js next to this config).

      # One-sided socket, identical orientation on every key of the board.
      # side B = socket on the underside of the PCB (use F for the top face).
      # Pin/pad positions checked against the Gateron switch + socket STEP models.
      keys:
        what: ks33_hotswap
        where: true
        params:
          side: B
          width: "{{keycap_u}}"    # 2 on the stabilized keys
          stab: "{{stab}}"         # PCB cutouts for the KS-57 stabilizer
          from: "{{column_net}}"   # C1..C9, shared by left key and mirrored key
          to: "{{colrow}}"         # unique per key (left and right differ)

      # Diodes (SOD-123, pad 1 = cathode = row, COL2ROW): key -> row. Left half uses R1..R5, right half R6..R10.
      diode_left:
        what: sod123
        where: /^hand-zone_/      # left half only
        params:
          from: "{{colrow}}"
          to: "{{row_net}}"
        adjust:
          shift: [7.5, 0]   # right of the switch, above socket pad 2
          rotate: 90  # key-side pad points down, towards pad 2
      diode_right:
        what: sod123
        where: /^mirror_hand-zone_/   # right (mirrored) half only
        params:
          from: "{{colrow}}"
          to: "{{row_net_r}}"
        adjust:
          shift: [-7.5, 0]  # mirror negates x/rotation -> same spot as the left half
          rotate: -90

      # LEDs, one data chain through all 80 keys:
      # LED_IND_IN -> 2 indicators -> LED_DATA -> left c1 ... left c9 -> right c9 ... right c1 -> LED_END
      # SK6812MINI-E (footprints/sk6812mini_e.js), params by function; VDD/GND default to VCC/GND
      leds_left:
        what: sk6812mini_e
        where: /^hand-zone_/      # left half only
        adjust:
          shift: [-0.69, 5.16]   # centre of the KS-33 light window (top view)
          rotate: 180
        params:
          side: B               # back-mounted, light passes through a PCB cutout
          DOUT: "{{led_l_out}}"
          DIN: "{{led_l_in}}"
      leds_right:
        what: sk6812mini_e
        where: /^mirror_hand-zone_/   # right (mirrored) half only
        adjust:
          shift: [0.69, 5.16]    # mirror negates x -> same window position (-0.69)
          rotate: 180
        params:
          side: B               # back-mounted, light passes through a PCB cutout
          DOUT: "{{led_r_out}}"
          DIN: "{{led_r_in}}"

      # LED decoupling caps (100 nF 0603), one per key, VCC -> GND,
      # on the back next to each LED (left of it, between LED and diode).
      # y follows the LED of the same half.
      caps_left:
        what: c_0603
        where: /^hand-zone_/      # left half only
        adjust:
          shift: [-6, 5.16]
          rotate: 90
        params:
          side: B
          from: VCC
          to: GND
      caps_right:
        what: c_0603
        where: /^mirror_hand-zone_/   # right (mirrored) half only
        adjust:
          shift: [-6, 5.16]
          rotate: 90
        params:
          side: B
          from: VCC
          to: GND

      # Helios (RP2040) MCU on the back, component side facing down, USB-C at
      # the top edge of the board (centre, under the OLED area). side B mirrors
      # the pinout because the module is turned over. Pads -> GPIO: see
      # footprints/helios.js. Spare: GP13, GP14, GP15 (P26-P28, under the OLED header).
      mcu:
        what: helios
        where:
          aggregate.parts:
            - hand-zone_c9_r2
            - mirror_hand-zone_c9_r2
          rotate: 0
          shift: [0, 54.7]       # module edge (USB end) 0.6 mm inside the PCB top edge
        params:
          side: B
          # rows, left half -> pins on the left side once turned over
          P17: R1              # GP29
          P18: R2              # GP28
          P19: R3              # GP27
          P20: R4              # GP26
          P21: R5              # GP22
          # rows, right half -> pins on the right side
          P7: R6               # GP4
          P8: R7               # GP5
          P9: R8               # GP6
          P10: R9              # GP7
          P11: R10             # GP8
          # columns (shared by both halves)
          # (bottom row kept free under the OLED header, except the outer pads)
          P1: C1               # GP0
          P2: C2               # GP1
          P31: C3              # GP10
          P30: C4              # GP11
          P29: C5              # GP16
          P25: CIRQUE_DR       # GP12, trackpad "data ready" (optional in QMK)
          P12: C6              # GP9
          P24: C7              # GP21
          P23: C8              # GP23
          P22: C9              # GP20
          # RGB data (5 V level-shifted output), I2C for OLED + Cirque (shared bus)
          P34: LED_DATA_MCU    # GP25 -> series resistor R1 -> LED_DATA
          P5: SDA              # GP2
          P6: SCL              # GP3

      # LED data series resistor (330 R) right at the MCU: damps ringing on the
      # long data line to the first LED and protects GP25. On the back, just
      # below the Helios' bottom castellations.
      led_data_res:
        what: r_0603
        where:
          aggregate.parts:
            - hand-zone_c9_r2
            - mirror_hand-zone_c9_r2
          rotate: 0
          shift: [8.8, 37.36]
        params:
          side: B
          value: 330
          from: LED_DATA_MCU
          to: LED_IND_IN       # -> 2 indicator LEDs -> LED_DATA -> key LEDs

      # Indicator LEDs = first 2 LEDs of the RGB chain (QMK index 0, 1),
      # back-mounted like the key LEDs, shining through the indicator_holes.
      # Next to the c9_r1 keys (inner side, 19.5 mm from the key centre, 8 mm past the keycap). Caps Lock
      # is shown on the Caps Lock key LED.
      #   0 right: function/layer lock (green)
      #   1 left:  active layout layer (any colour)
      indicator_fn:   # QMK LED 0
        what: sk6812mini_e
        where:
          ref: mirror_hand-zone_c9_r1
          shift: [19.5, 0]
        params:
          side: B
          DIN: LED_IND_IN
          DOUT: LED_IND_1
      indicator_layer:   # QMK LED 1
        what: sk6812mini_e
        where:
          ref: hand-zone_c9_r1
          shift: [19.5, 0]
        params:
          side: B
          DIN: LED_IND_1
          DOUT: LED_DATA
      # 100 nF decoupling, 4 mm south of each LED
      indicator_fn_cap:
        what: c_0603
        where:
          ref: mirror_hand-zone_c9_r1
          shift: [19.5, -4]
          rotate: 0
        params:
          side: B
          from: VCC
          to: GND
      indicator_layer_cap:
        what: c_0603
        where:
          ref: hand-zone_c9_r1
          shift: [19.5, -4]
          rotate: 0
        params:
          side: B
          from: VCC
          to: GND

      # Bulk capacitor (10 uF) on the LED supply where 5 V enters, next to the
      # Helios' 5V and GND castellations (west side). The 80 per-LED 100 nF
      # caps handle the fast spikes, this one the overall current steps.
      led_bulk_cap:
        what: c_0805
        where:
          aggregate.parts:
            - hand-zone_c9_r2
            - mirror_hand-zone_c9_r2
          rotate: 90
          shift: [-12.6, 68.66]
        params:
          side: B
          value: 10uF
          from: VCC
          to: GND

      # 0.96" OLED (SSD1306, I2C) on the top side, rotated 180 deg: header at the
      # bottom edge, close to the trackpad ring; the module sits in the plate
      # cutout (outline 'oled'), raised on its header. Display content is rotated
      # in firmware. Its 2 bottom corner holes take screws (oled_screw); the 2 top
      # ones are free (the Helios castellations are 0.7 mm away, no room for a stud).
      oled:
        what: oled_i2c
        where:
          aggregate.parts:
            - hand-zone_c9_r2
            - mirror_hand-zone_c9_r2
          rotate: 180
          shift: [0, 23.5]   # header row; module up to y 49.3 (9.8 mm south of the old spot)
        params:
          side: F
          holes: false
          GND: GND
          VDD: 3V3
          SCL: SCL
          SDA: SDA

      # Molex 505278 FFC connector for the Cirque TM040040 (I2C mode, R1 removed
      # on the trackpad), on the back, NORTH of the FFC slot, opening facing
      # south towards it. Cable route for a 30 mm FFC (pad raised 7.1 mm to
      # keycap height, connector moved 7.1 mm south to keep 30 mm): down from the trackpad's
      # vertical connector through the slot (y -17.4), 90 deg bend, then flat
      # under the PCB ~11.9 mm north into this connector (no folds, no twist).
      # Straight cable, so trackpad pin n lands on Molex pin n:
      #   1 SCK 2 MISO 3 SS 4 DR 5 MOSI 6 BTN2 7 BTN3 8 BTN1
      #   9 SCL 10 SDA 11 GND 12 VDD(3.3 V)
      # Cable type: the face touching the contacts here (towards the PCB) is the
      # face pointing at the trackpad centre at the other end -> "same side"
      # FFC if the trackpad connector's contacts are on its inner wall,
      # "opposite side" if on the outer wall (checked: outer wall -> opposite-
      # side / Type D cable, 12 pin 0.5 mm, 30 mm). Verify pin 1 on the real part.
      trackpad_conn:
        what: molex_505278
        where:
          aggregate.parts:
            - hand-zone_c9_r2
            - mirror_hand-zone_c9_r2
          rotate: 0
          shift: [0, 5.5]    # 30 mm FFC: connector bottom z 10.1 -> drop 1.6 mm to the PCB bottom, flat run ~19.3 mm
        params:
          side: B
          P1: TP_SCK           # trackpad 1 (SPI only)
          P2: TP_MISO          # trackpad 2 (SPI only)
          P3: TP_SS            # trackpad 3 (SPI only)
          P4: CIRQUE_DR        # trackpad 4 DR -> GP12
          P5: TP_MOSI          # trackpad 5 (SPI only)
          P6: TP_BTN2          # trackpad 6 (unused)
          P7: TP_BTN3          # trackpad 7 (unused)
          P8: TP_BTN1          # trackpad 8 (unused)
          P9: SCL              # trackpad 9 SCL
          P10: SDA             # trackpad 10 SDA
          P11: GND             # trackpad 11 GND
          P12: 3V3             # trackpad 12 VDD
          MP: GND

      # Cirque TM040040 trackpad: 3D model only (it is cabled, not soldered).
      # Its PCB sits 11.51 mm above the keyboard PCB on the 5 risers (pad top at
      # keycap height, z 22.6 in the case), so the
      # 4.1 mm of components underneath clear the board. Model is 5.15 mm
      # thick with its origin mid-height: z offset = 11.51 - (2.6 - 0.99) = 9.9.
      trackpad_model:
        what: mech_model
        where:
          aggregate.parts:
            - hand-zone_c9_r2
            - mirror_hand-zone_c9_r2
          rotate: 0
          shift: [0, -2]
        params:
          label: TM040040
          model: ${KIPRJMOD}/../../3dmodels/TM040040-2024-303.stp
          model_offset: [0, 0, 4.925]   # pad top z 17.6 = PCB top + 7.5 (5 mm pad on the plate; model origin mid-height)

      # Claude logo (8 mm, front silkscreen) south of the left c5_r1 2U key:
      # keycap ends ~9.1 mm below the key centre, board edge 21 mm -> ~1 mm each side.
      claude_logo:
        what: claude_logo
        where: /^hand-zone_c5_r1$/
        adjust:
          shift: [0, -15]
        params:
          side: F
          size: 8

