        shift: [9.500, 9.500]
    - what: rectangle
      size: [5.00, 2]
      where:
        ref: mirror_hand-zone_c4_r4
        shift: [7.000, 9.500]
    - what: rectangle
      size: [2, 2]
      where:
        ref: hand-zone_c7_r1
        shift: [0.000, 9.500]
    - what: rectangle
      size: [5.00, 2]
      where:
        ref: hand-zone_c7_r1
        shift: [2.500, 9.500]
    - what: rectangle
      size: [5.00, 2]
      where:
        ref: hand-zone_c7_r1
        shift: [-2.500, 9.500]
    - what: rectangle
      size: [2, 2]
      where:
        ref: mirror_hand-zone_c7_r1
        shift: [0.000, 9.500]
    - what: rectangle
      size: [5.00, 2]
      where:
        ref: mirror_hand-zone_c7_r1
        shift: [2.500, 9.500]
