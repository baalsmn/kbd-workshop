# QMK firmware build: official QMK at a pinned release + our keyboard folder
# (<keyboard>/firmware/<keyboard>, generated by tools/lib/qmk_gen.py). No QMK fork needed.
# The .uf2 is attached to the run as an artifact (Actions -> the run -> Artifacts).
# Flash: double-tap the Helios reset, copy the .uf2 to the RPI-RP2 drive.
name: firmware

on:
  push:
    paths:
      - '*/firmware/**'
      - '.github/workflows/firmware.yml'
  workflow_dispatch:

env:
  QMK_VERSION: '0.34.7'

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli
    strategy:
      fail-fast: false
      matrix:
        keyboard: [hachigo74]
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          path: workshop

      - name: Checkout QMK ${{ env.QMK_VERSION }}
        run: |
          git config --global --add safe.directory '*'
          git clone --depth 1 --branch "$QMK_VERSION" https://github.com/qmk/qmk_firmware.git qmk_firmware
          cd qmk_firmware
          git submodule update --init --recursive --depth 1

      - name: Add the keyboard
        run: cp -r "workshop/${{ matrix.keyboard }}/firmware/${{ matrix.keyboard }}" "qmk_firmware/keyboards/${{ matrix.keyboard }}"

      - name: Lint
        working-directory: qmk_firmware
        env:
          QMK_HOME: ${{ github.workspace }}/qmk_firmware
        run: qmk lint -kb "${{ matrix.keyboard }}" -km default --strict || qmk lint -kb "${{ matrix.keyboard }}" -km default

      - name: Build
        working-directory: qmk_firmware
        env:
          QMK_HOME: ${{ github.workspace }}/qmk_firmware
        run: qmk compile -kb "${{ matrix.keyboard }}" -km default

      - name: Upload the firmware
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.keyboard }}-firmware
          path: qmk_firmware/*.uf2
          if-no-files-found: error
