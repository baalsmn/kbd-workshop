# Firmware build: Vial's QMK fork (vial-kb/vial-qmk) at a pinned commit + our keyboard
# folder (<keyboard>/firmware/<keyboard>, generated by tools/lib/qmk_gen.py), keymap "vial".
# No fork of our own needed. The .uf2 is attached to the run as an artifact (Actions ->
# the run -> Artifacts). Flash: double-tap the Helios reset, copy the .uf2 to the RPI-RP2
# drive. Then open the Vial app (get.vial.today): the layout comes from the keyboard.
name: firmware

on:
  push:
    paths:
      - '*/firmware/**'
      - '.github/workflows/firmware.yml'
  workflow_dispatch:

env:
  # vial-qmk has no release tags; this is its "vial" branch on 2026-07-27 (based on QMK 0.29)
  VIAL_QMK_COMMIT: 'dd43959ae5c08d8a28d38a1acf7b04e86b14a344'

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli
    strategy:
      fail-fast: false
      matrix:
        keyboard: [hachigo74]
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          path: workshop

      - name: Checkout vial-qmk ${{ env.VIAL_QMK_COMMIT }}
        run: |
          git config --global --add safe.directory '*'
          git init -q qmk_firmware
          cd qmk_firmware
          git remote add origin https://github.com/vial-kb/vial-qmk.git
          git fetch -q --depth 1 origin "$VIAL_QMK_COMMIT"
          git checkout -q FETCH_HEAD
          git submodule update --init --recursive --depth 1

      - name: Add the keyboard
        run: cp -r "workshop/${{ matrix.keyboard }}/firmware/${{ matrix.keyboard }}" "qmk_firmware/keyboards/${{ matrix.keyboard }}"

      - name: Lint
        # style findings are reported but don't stop the build
        continue-on-error: true
        working-directory: qmk_firmware
        env:
          QMK_HOME: ${{ github.workspace }}/qmk_firmware
        run: qmk lint -kb "${{ matrix.keyboard }}" -km vial

      - name: Build
        working-directory: qmk_firmware
        env:
          QMK_HOME: ${{ github.workspace }}/qmk_firmware
        run: qmk compile -kb "${{ matrix.keyboard }}" -km vial

      - name: Upload the firmware
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.keyboard }}-firmware
          path: qmk_firmware/*.uf2
          if-no-files-found: error
